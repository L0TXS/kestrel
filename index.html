<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>KESTREL Field Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0B1426;--panel:#13203A;--panel2:#1A2A4A;--line:#2A3B5E;--text:#E8ECF5;--mute:#9AA6C2;--red:#D2334E;--indigo:#8A8FF0;--ok:#3FB37F;--amber:#E0A93B;--radius:12px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Calibri,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:rgba(11,20,38,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
header .brand{font-weight:800;letter-spacing:.22em;font-size:15px}header .brand span{color:var(--red)}
header .sub{color:var(--mute);font-size:12px;margin-left:auto;text-align:right}
main{max-width:860px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0E1930;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:9px 2px 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button.on{color:var(--text)}nav button.on svg{stroke:var(--red)}
h2{font-size:20px;margin:6px 0 10px}h3{font-size:16px;margin:16px 0 8px;color:var(--indigo)}h4{margin:10px 0 6px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--red);border-color:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn.sm{padding:6px 10px;font-size:13px}
input,select,textarea{background:#0E1930;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;width:100%}
label{font-size:12px;color:var(--mute);display:block;margin:6px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mute{color:var(--mute)}.small{font-size:13px}.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--red);color:#fff}
.tag.i{background:#2F3570}.tag.g{background:#2A3B5E}
a.code{color:#FF8FA2;font-weight:700;text-decoration:none;border-bottom:1px dotted #FF8FA2;cursor:pointer;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600;font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.hl td{background:rgba(210,51,78,.16)}
details{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:8px 0}
details>summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}details>summary:after{content:"+";margin-left:auto;color:var(--mute);font-size:20px;line-height:1}
details[open]>summary:after{content:"−"}details>.in{padding:0 14px 12px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}.ex .chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex:0 0 26px;display:grid;place-items:center;cursor:pointer;margin-top:2px}
.ex.done .chk{background:var(--ok);border-color:var(--ok)}.ex.done .chk:after{content:"✓";color:#fff;font-weight:800}
.ex.done .exb{opacity:.55}.exb{flex:1;min-width:0}.exn{font-weight:600}.exm{font-size:13px;color:var(--mute)}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;margin:2px 4px 0 0}
.banner{background:linear-gradient(135deg,#1C2B52,#2A1830);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.banner .big{font-size:22px;font-weight:800}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}.kv div{background:rgba(255,255,255,.04);border-radius:8px;padding:6px 8px}.kv b{display:block;font-size:11px;color:var(--mute);font-weight:600}
.warn{border-left:4px solid var(--amber);background:rgba(224,169,59,.08);padding:10px 12px;border-radius:8px;margin:10px 0}
.danger{border-left:4px solid var(--red);background:rgba(210,51,78,.1);padding:10px 12px;border-radius:8px;margin:10px 0}
#sheet{position:fixed;inset:0;z-index:50;display:none}#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;border-top:3px solid var(--red);padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:860px;margin:0 auto}
@media(min-width:900px){#sheet .pane{left:50%;transform:translateX(-50%);width:760px;bottom:auto;top:6vh;border-radius:18px}}
.ctitle{display:flex;gap:8px;align-items:center;margin-bottom:6px}.ctitle h2{margin:0;font-size:19px}
dl{margin:0}dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:10px;font-weight:700}dd{margin:2px 0 0}
ol.cues{margin:4px 0 0;padding-left:20px}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .f{font-size:22px;font-weight:800}.flash .b{font-size:15px;text-align:left}
.prog{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.timer{font-size:68px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.phase{text-align:center;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.phase.work{color:var(--red)}.phase.rest{color:var(--ok)}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.right{background:var(--ok);border-color:var(--ok)}.opt.wrong{background:#7A2230;border-color:#7A2230}
.g-green{color:var(--ok)}.g-amber{color:var(--amber)}.g-red{color:var(--red)}
ul.tight{margin:4px 0;padding-left:18px}ul.tight li{margin:3px 0}
.searchbar{position:sticky;top:58px;z-index:10;background:var(--bg);padding:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>

<script>
const D = {"cap":[{"t":"p","x":"Right-click the table and choose Update Field (or press F9) to refresh page numbers after opening."},{"t":"h1","x":"1. Doctrine"},{"t":"h2","x":"1.1 Foreword"},{"t":"p","x":"KESTREL is a conditioning protocol for the operative who must be capable of anything, anywhere, at short notice. It draws on the selection and training standards of intelligence services, special units, and surf rescue, and distils them into one system for building a complete athlete: strong, fast, enduring, mobile, durable, at home in the water, and dangerous at close range."},{"t":"p","x":"The kestrel is a small falcon that hunts over cities, coastlines, cliffs, and open country alike. It hovers motionless against the wind, watches patiently, and strikes with precision. The name was chosen for that blend of adaptability, economy, and control. Each letter is one of the seven training pillars that structure this manual, and three annexes (Combat, Water, and Mind) extend them into the domains where field operatives are most often tested."},{"t":"p","x":"The method is compound-first. Big multi-joint movements, sprints, swims, carries, and fighting rounds form the core of every week, supported by targeted work for the joints, tendons, spine, and nervous system so that performance lasts for decades. Every session can be run in a gym, a park, a playground, a pool, on a beach, or in a hotel room."},{"t":"p","x":"Volume I: Foundations is the base volume of the KESTREL Field Manual. Later volumes will cover nutrition and recovery in depth, and a skills expansion covering combatives, urban movement, load carriage, and advanced aquatic work."},{"t":"h2","x":"1.2 The Seven Pillars and Three Annexes"},{"t":"table","h":["Code","Pillar","What it trains"],"r":[["K","Kinetic","Power, speed, acceleration, and change of direction."],["E","Endurance","Aerobic base, threshold capacity, and repeat-effort tolerance on land and in water."],["S","Strength","Maximal and relative strength through the big patterns: squat, hinge, push, pull, and single-leg."],["T","Tactical","Combatives conditioning, grip, ground-to-standing transitions, casualty movement, and decision-making under fatigue."],["R","Resilience","Mobility, tissue preparation, joint integrity, and nervous-system control."],["V","Evasion","Urban movement: crawling, vaulting, climbing, precision, falling safely, and water escape."],["L","Load","Rucking and loaded carries: moving weight over distance for long periods."],["C","Combat Annex","Striking, kicking, grappling movement, accuracy, reaction speed, and fight-specific conditioning."],["W","Water Annex","Swim technique, aquatic endurance and speed, breath control, survival skills, surf readiness, and rescue."],["M","Mind Annex","Observation, memory, navigation, thinking under fatigue, visualisation, and hand-eye coordination."]]},{"t":"p","x":"Evasion uses the code V in the exercise library to keep it distinct from Endurance (E)."},{"t":"h2","x":"1.3 Physical Qualities Matrix"},{"t":"p","x":"An elite all-rounder needs every physical quality at a high level, with no gaps an opponent, an environment, or an injury can exploit. The matrix shows where each quality is built."},{"t":"table","h":["Quality","Pillars","Key movements"],"r":[["Power and explosiveness","K, C","K-01 to K-03, K-08 to K-15, C-08, T-07"],["Maximal and relative strength","S","S-01 to S-05 (compound lifts), S-09 to S-15 (bodyweight mastery and isometrics)"],["Speed and acceleration","K, E, W","K-05, K-07, W-04, W-11"],["Agility and footwork","K, C","K-06, K-07, C-01"],["Endurance and stamina","E, L, W","E-01 to E-08, L-01, W-03, W-12"],["Cardiorespiratory health and VO2max","E, W","E-03, E-06, W-03, W-04, combat rounds"],["Breath control and breath-holding","R, W","R-08, land breath tables (6.5), W-14"],["Flexibility and mobility","R, C","R-01 to R-03, R-12, R-14, R-18, R-20, R-23, C-12"],["Balance and proprioception","V, R","V-04, V-05, R-16, single-leg work"],["Coordination, accuracy, and reaction","C, V, K, M","C-01, C-02, C-10, V-04, K-04, K-12, M-05"],["Spinal health and trunk stability","R, L","R-09 to R-11 (the Big Three), R-17, R-22, L-03, L-08, L-09"],["Joint, tendon, ligament, and cartilage health","R, S, T","R-04, R-05, R-12, R-13, R-15, R-16, R-21, R-23, S-08, S-13, S-14, T-09"],["Combat capacity and fight endurance","T, C","T-01 to T-08, C-01 to C-10, Section 7"],["Durability and impact tolerance","T, R, L","R-15, T-06, T-07, V-06, L-01"],["Aquatic and surf competence","W, V, E","W-01 to W-16, V-08, Section 6"],["Awareness, memory, and decision-making","M, T","M-01 to M-05, T-08, Section 8.7"]]},{"t":"h2","x":"1.4 Operator Character"},{"t":"p","x":"Physical capability is only half of an operative. The other half is character, and it is trained the same way: deliberately, under pressure, and every week. KESTREL adopts four qualities long associated with elite commando selection, and adds a fifth of its own."},{"t":"table","h":["Quality","What it looks like in training"],"r":[["Courage","Starting the session you are dreading; entering cold water; telling a coach the truth about pain."],["Determination","Finishing the last round with the same technique as the first."],["Unselfishness","Carrying the extra load for a partner; spotting properly; leaving equipment better than you found it."],["Cheerfulness in adversity","Humour and composure when it is wet, cold, and late, and the session still has an hour to run."],["Discretion","Training quietly, keeping records honest, and letting performance speak."]]},{"t":"h2","x":"1.5 Operating Principles"},{"t":"ol","x":"**Compound first.** Squats, hinges, presses, pulls, carries, sprints, swims, and rounds do most of the work. Isolation work exists only to protect joints or fix weak links.","r":"n1"},{"t":"ol","x":"**Train for the task.** Every movement earns its place by transferring to running, carrying, climbing, fighting, swimming, or recovering. Appearance is a by-product of capability.","r":"n1"},{"t":"ol","x":"**Quality before load.** Technique is the first progression. Load, speed, and volume follow only when the movement is clean at the current level.","r":"n1"},{"t":"ol","x":"**Minimum effective dose, maximum consistency.** Twelve excellent weeks beat three heroic ones. Every session should leave you able to train again tomorrow.","r":"n1"},{"t":"ol","x":"**Any environment is the gym.** Every movement has an alternative for parks, playgrounds, beaches, pools, and hotel rooms (see 2.3).","r":"n1"},{"t":"ol","x":"**Durability is a skill.** Spine, joints, tendons, and the nervous system are trained deliberately every week, before problems appear.","r":"n1"},{"t":"ol","x":"**Water is non-negotiable.** An operative who cannot swim strongly, hold their breath calmly, and handle surf has a gap the field will find.","r":"n1"},{"t":"ol","x":"**Discretion.** Train in public with respect: no damage, no trespass, no showing off. Leave every space exactly as you found it.","r":"n1"},{"t":"ol","x":"**Measure, then adjust.** The Selection Assessment sets the baseline, the logbook tracks the work, and the readiness check decides the day.","r":"n1"},{"t":"h1","x":"2. Before You Begin"},{"t":"h2","x":"2.1 Safety and Readiness"},{"t":"h2","x":"2.2 Equipment Tiers"},{"t":"table","h":["Tier","Kit","Use"],"r":[["Tier 1: Street","Bodyweight, park bars, benches, stairs, hills, kerbs, a backpack loaded with water bottles or books, a towel, a resistance band, a skipping rope, and a suspension trainer with a door anchor (the single best travel tool).","Hotel rooms, travel, parks, beaches, and any time a gym is unavailable."],["Tier 2: Field Kit","Ruck plate and pack (10 to 25 kg), kettlebells (16, 24, 32 kg), sandbag (20 to 60 kg), rings, bands, medicine and slam balls, weight plates, focus mitts, climbing rope, fins, pull buoy, kickboard.","A garage or home setup covering almost every movement at full intensity."],["Tier 3: Facility","Barbell, rack, trap bar, dumbbells, landmine, sled, air bike, rower, heavy bag, pool.","Full programme as written, with the best options for maximal strength and conditioning."]]},{"t":"h2","x":"2.3 Environment Substitution Guide"},{"t":"p","x":"Each pattern below has an equivalent for every environment. Keep the intent (heavy, explosive, or enduring) and swap the tool."},{"t":"table","h":["Pattern","Gym","Park or playground","Beach","Hotel or improvised"],"r":[["Squat","Front squat","Loaded-pack front squat; pistol to a bench","Sandbag or partner squat; soft-sand jump squat","Split squat with back foot on the bed; tempo squat"],["Hinge","Trap bar deadlift; kettlebell swing","Pack swing; single-leg RDL with pack","Sandbag clean; broad jumps in sand","Single-leg RDL; hip thrust off the bed"],["Vertical pull","Weighted pull-up","Bar or monkey-bar pull-ups","Sound tree branch; swim pull sets","Suspension trainer on a door anchor (S-15)"],["Push","Weighted dip; press","Bar dips; push-ups","Push-ups in sand; partner-resisted push","Feet-elevated push-ups; pike push-ups"],["Carry","Farmer's carry; sled","Loaded pack; shopping bags","Sandbag, water jugs, partner carry","Suitcase carry with a full bag"],["Conditioning","Air bike; rower","Hill sprints; stairs","Soft-sand sprints; run-swim-run","Black Site deck; rope; burpees"],["Combat","Heavy bag; mitts","Shadowboxing; ball on a string","Shadowboxing in sand","Safe House; shadowboxing"],["Water","Pool sessions","Public pool","Surf sessions (W-09 to W-12)","Hotel pool for technique sets"]]},{"t":"h2","x":"2.4 Terminology"},{"t":"table","h":["Term","Meaning"],"r":[["RPE","Rating of perceived exertion, 1 to 10. For lifting, RPE 8 means about two reps left in reserve; RPE 10 is a true maximum."],["RIR","Reps in reserve: how many more clean reps you could have done. RIR 2 equals RPE 8."],["Tempo","Four numbers: lowering, bottom pause, lifting, top pause, in seconds. 3-1-1-0 means a 3 s descent, 1 s pause, 1 s lift, no top pause."],["EMOM / AMRAP","Every minute on the minute / as many rounds or reps as possible in a fixed time."],["sRPE","Session load: session RPE multiplied by duration in minutes."],["CSS","Critical swim speed: the fastest pace you can sustain in the water for roughly 30 minutes (see 6.3)."],["A1 / A2","Paired exercises performed alternately with the stated rest between them."]]},{"t":"h2","x":"2.5 Intensity Zones"},{"t":"table","h":["Zone","% max HR","RPE","Talk test","Use in KESTREL"],"r":[["Z1 Recovery","50 to 60","1 to 2","Full conversation","Debrief walks, warm-ups, easy swims"],["Z2 Base","60 to 70","3 to 4","Full sentences","Zone 2 runs, rucking, long steady swims"],["Z3 Tempo","70 to 80","5 to 6","Short sentences","Steady runs, aerobic shadowboxing"],["Z4 Threshold","80 to 90","7 to 8","A few words","Tempo blocks, 400 m repeats, CSS sets, bag rounds"],["Z5 Maximal","90 to 100","9 to 10","None","Sprints, sprint swims, burst rounds"]]},{"t":"p","x":"Estimate maximum heart rate as 208 minus 0.7 times age, or use the highest value seen at the end of a 2.4 km test. Aim for roughly 80 percent of weekly endurance time in Zones 1 and 2 and 20 percent in Zones 4 and 5. Swimming heart rates run about 10 beats lower than running at the same effort."},{"t":"h1","x":"3. Selection Assessment"},{"t":"p","x":"The Selection Assessment establishes your baseline, identifies the weakest pillar, and sets your grade. Run it in Week 1 and again in the final week of every block. Test fresh, after a full warm-up, in the same order and conditions each time."},{"t":"h2","x":"3.1 Protocol"},{"t":"h3","x":"Day 1: Power, Strength, and Engine"},{"t":"ol","x":"Standing broad jump: best of three, measured to the heel nearest the line.","r":"n2"},{"t":"ol","x":"Overhead backward medicine ball throw (4 kg): best of three, measured to the first point of contact.","r":"n2"},{"t":"ol","x":"5-10-5 pro agility shuttle: best of two each direction, averaged.","r":"n2"},{"t":"ol","x":"Trap bar deadlift: work up to a 3-rep max at RPE 9; estimated 1RM equals load multiplied by 1.1.","r":"n2"},{"t":"ol","x":"Strict pull-ups: dead hang to chin over bar, no kipping.","r":"n2"},{"t":"ol","x":"Push-ups: maximum in 2 minutes, chest to a fist-height marker, full lockout.","r":"n2"},{"t":"ol","x":"300 m shuttle: 12 x 25 m, touching each line with a foot, after 5 minutes of recovery.","r":"n2"},{"t":"ol","x":"2.4 km run: flat measured course, after 10 minutes of recovery. Record heart rate at the finish and again exactly 1 minute later (heart-rate recovery).","r":"n2"},{"t":"h3","x":"Day 2: Water"},{"t":"ol","x":"400 m swim, any stroke, timed. Rest 10 minutes.","r":"n3"},{"t":"ol","x":"200 m swim, all-out, timed (used with the 400 m to calculate CSS).","r":"n3"},{"t":"ol","x":"10-minute tread in deep water.","r":"n3"},{"t":"ol","x":"50 m casualty tow of a partner with a rescue tube (where trained and equipped).","r":"n3"},{"t":"ol","x":"Optional, supervised only: underwater swim for distance with a dedicated spotter. Two normal breaths before, no hyperventilation.","r":"n3"},{"t":"h3","x":"Day 3: Load, Combat, and Mobility"},{"t":"ol","x":"5 km ruck with 18 kg dry weight: walk only.","r":"n4"},{"t":"ol","x":"Farmer's carry, 2 x 32 kg: maximum unbroken distance.","r":"n4"},{"t":"ol","x":"Bag Output Test: 3 x 3 min rounds at maximum sustainable output, 1 min rest. Count strikes per round (partner or video).","r":"n4"},{"t":"ol","x":"Mobility and stability screen (3.3).","r":"n4"},{"t":"h2","x":"3.2 Physical, Water, and Combat Standards"},{"t":"table","h":["Test","Cleared","Operative","Black Grade"],"r":[["Standing broad jump","2.20 m","2.45 m","2.70 m"],["Overhead backward throw, 4 kg","10 m","12 m","14 m"],["5-10-5 shuttle","5.4 s","5.0 s","4.6 s"],["Trap bar deadlift (est. 1RM)","1.5 x BW","1.8 x BW","2.2 x BW"],["Strict pull-ups","8","12","18"],["Push-ups (2 min)","50","65","80"],["300 m shuttle (12 x 25 m)","66 s","61 s","57 s"],["2.4 km run","10:30","9:30","8:45"],["Heart-rate recovery, 1 min after the run","12 bpm drop","20 bpm drop","30 bpm drop"],["400 m swim","8:30","7:00","6:00"],["10 min tread","Complete","Last 2 min hands up","Last 3 min hands out"],["50 m casualty tow","Complete","Under 1:45","Under 1:20"],["Underwater swim (supervised)","15 m","20 m","25 m"],["5 km ruck, 18 kg","50:00","45:00","40:00"],["Farmer's carry, 2 x 32 kg","60 m","100 m","150 m"],["Bag Output Test drop-off, round 1 to 3","25% or less","15% or less","10% or less"]]},{"t":"p","x":"Standards are calibrated for a trained adult male of roughly 75 to 90 kg. Scale them for bodyweight, age, and sex where needed, and treat them above all as personal benchmarks."},{"t":"h2","x":"3.3 Mobility and Stability Screen"},{"t":"table","h":["Test","Method","Cleared","Operative","Black Grade"],"r":[["Knee-to-wall","Lunge, front knee touches wall with heel down; measure toe to wall","8 cm","10 cm","12 cm"],["Active straight leg raise","Lying, lift one straight leg; estimate the hip angle","70°","80°","90°"],["Back-scratch reach","One hand over the shoulder, one up the back; gap between fingers","Under 10 cm","Touching","Overlapping"],["Single-leg balance, eyes closed","Barefoot, hands on hips","15 s","30 s","45 s"],["Side bridge","Hold per side","60 s","90 s","120 s"],["Forearm plank","Straight line, shoulder to heel","2:00","3:00","4:00"]]},{"t":"p","x":"Record left and right separately. A side-to-side difference of more than 10 percent on any test is a priority to fix in the next block."},{"t":"h2","x":"3.4 Grading"},{"t":"h2","x":"3.5 Field Check"},{"t":"p","x":"A short test run in the last session of every fourth week, between full Selection Assessments. It checks that the engine, bodyweight strength, and water fitness are on track without a full testing week. Rest 2 to 5 minutes between events."},{"t":"table","h":["Event","Standard to beat"],"r":[["450 m swim, sidestroke or breaststroke","Your previous time"],["Push-ups, 2 min","Your previous score"],["Hollow rocks, 2 min (spine-friendly in place of sit-ups)","Your previous score"],["Strict pull-ups, max","Your previous score"],["2.4 km run","Your previous time"]]},{"t":"callout","title":"Weakest pillar rule","lines":["Identify the pillar or annex with your lowest relative score. For the next block, add one extra exercise from it to two sessions per week, or swap one Signature Operation for a session biased towards it."]},{"t":"h1","x":"4. Session Architecture"},{"t":"p","x":"Every KESTREL session follows the same order so the nervous system is freshest for the most demanding work and the body is prepared before load arrives."},{"t":"table","h":["Block","Duration","Content"],"r":[["1. Warm-up (RAMP)","10 to 12 min","Raise, Activate, Mobilise, Potentiate (4.1)."],["2. Kinetic","5 to 15 min","Jumps, sprints, throws, and swings at full intent with full rest."],["3. Strength","20 to 30 min","One or two compound lifts, then one or two accessory movements."],["4. Tactical, Combat, or Load","10 to 20 min","Carries, drags, bag rounds, grappling movement, or grip work."],["5. Conditioning","8 to 20 min","Intervals or a circuit, when programmed."],["6. Resilience and Debrief","5 to 10 min","Joint Integrity work, box breathing, and logging the session."]]},{"t":"h2","x":"4.1 RAMP Warm-up"},{"t":"table","h":["Phase","Time","Standard sequence"],"r":[["Raise","3 to 4 min","Easy jog, skipping rope, or air bike; 10 m carioca each way."],["Activate","2 to 3 min","Glute bridge x 10; bird dog (R-11) x 5 per side; band pull-apart x 15."],["Mobilise","3 min","World's greatest stretch (R-01) x 5 per side; 90/90 hip switch (R-02) x 8; open book (R-14) x 5 per side."],["Potentiate","2 to 3 min","3 x 20 m build-up runs; 2 x 10 pogo hops; two ramping sets of the first main lift."]]},{"t":"h2","x":"4.2 Daily Joint Integrity Routine"},{"t":"p","x":"Ten to twelve minutes, every day, including rest days. This routine is the backbone of spinal health, joint longevity, and connective-tissue resilience. On waking, run the Morning Joint Mobility Sequence (R-23) first; three to five times per week, add the Foot-to-Hip Longevity Flow (R-20)."},{"t":"table","h":["#","Movement","Dose"],"r":[["1","R-12 Hip and shoulder CARs","3 circles each direction, each joint"],["2","R-09 Curl-up","Pyramid 6, 4, 2 holds of 10 s"],["3","R-10 Side bridge","Pyramid 6, 4, 2 holds of 10 s per side"],["4","R-11 Bird dog","Pyramid 6, 4, 2 per side"],["5","R-14 Open book thoracic rotation","8 per side"],["6","R-06 Dead hang and scapular pull-up","2 x 30 s"],["7","R-16 Foot and wrist conditioning","3 min"],["8","R-08 Box breathing","2 min"]]},{"t":"h2","x":"4.3 Debrief"},{"t":"h1","x":"5. Exercise Library"},{"t":"p","x":"120 movements across the seven pillars and three annexes. Each card lists equipment, purpose, three execution cues, the standard dose, a progression, a regression, and a street or improvised variant."},{"t":"p","x":"Most decisive moments on the street last under ten seconds: a sprint to cover, a jump across a gap, a shove that creates space. Kinetic work builds the rate of force development that wins those moments."},{"t":"p","x":"The aerobic engine pays for everything else. A large base speeds recovery between efforts, between sessions, and between operations, and keeps the mind clear when the heart rate climbs."},{"t":"p","x":"Strength is the reserve every other quality draws on. A stronger operative moves loads with less effort, resists injury, and has more left in the tank for skill."},{"t":"p","x":"Fitness only counts when it transfers to the task. Tactical work trains the body to strike, grapple, drag, and think while the lungs burn."},{"t":"p","x":"The best programme is the one you can keep doing. Resilience work keeps joints, tendons, and the nervous system ready for the next session and out of the clinic."},{"t":"p","x":"Getting over, under, and through the environment efficiently is a skill. Evasion work turns raw athleticism into movement that is quiet, economical, and safe."},{"t":"p","x":"Operatives carry kit, people, and supplies. Load work hardens the feet, back, hips, and grip, and builds the dull, grinding durability that separates the trained from the merely fit."},{"t":"p","x":"Fighting ability rests on technique, power, speed, accuracy, and the conditioning to repeat them for minutes at a time. The Combat Annex supplements the Tactical pillar with the footwork, kicking, grappling movement, accuracy, and reaction work that close-range encounters demand."},{"t":"p","x":"Operatives work on coastlines, harbours, rivers, and ships. The Water Annex builds the technique, speed, endurance, breath control, survival skills, and surf craft to move through water confidently, escape it, and bring others out of it."},{"t":"p","x":"An operative's most important asset sits above the shoulders. The Mind Annex trains observation, memory, navigation, calm thinking under physical stress, and hand-eye coordination. Most drills slot into runs, rucks, and warm-ups at no extra time cost."},{"t":"h1","x":"6. Water and Surf Readiness"},{"t":"h2","x":"6.1 Freestyle Technique Priorities"},{"t":"ol","x":"**Body line.** Head neutral with the eyes looking down, hips high, body long and horizontal. A low head and high hips lower drag more than any amount of extra effort.","r":"n5"},{"t":"ol","x":"**Rotation.** Rotate the whole body 30 to 45 degrees to each side with every stroke, driven from the hips and trunk.","r":"n5"},{"t":"ol","x":"**Catch.** Enter the hand in front of the shoulder, extend, then tip the fingertips down with a high elbow so the forearm faces backwards.","r":"n5"},{"t":"ol","x":"**Pull and finish.** Push the water straight back past the hip.","r":"n5"},{"t":"ol","x":"**Kick.** A steady, compact two-beat or six-beat kick from the hips; the kick stabilises more than it propels in distance swimming.","r":"n5"},{"t":"ol","x":"**Breathing.** Exhale continuously underwater, rotate the head with the body to breathe, and return the face quickly. Train bilateral breathing as the default.","r":"n5"},{"t":"h2","x":"6.2 Swim Session Structure"},{"t":"table","h":["Block","Volume","Content"],"r":[["Warm-up","300 to 400 m","Easy mixed strokes, including survival strokes."],["Drills","200 to 400 m","W-01 drills, kick on the side, sculling."],["Main set","800 to 2,000 m","CSS threshold sets (W-03), sprints (W-04), or long steady swims, depending on the phase."],["Kick or pull","200 to 400 m","W-05 or W-06."],["Water skills","5 to 15 min","Tread (W-07), survival strokes (W-08), tows (W-13), clothed swim (V-08), supervised underwater work (W-14)."],["Warm-down","100 to 200 m","Easy backstroke or breaststroke."]]},{"t":"h2","x":"6.3 Critical Swim Speed (CSS)"},{"t":"p","x":"CSS approximates your swim threshold and sets training paces. Swim a timed 400 m and a timed 200 m (both all-out, with full recovery between). Then:"},{"t":"callout","title":"CSS calculation","lines":["CSS (m/s) = 200 / (400 m time in seconds minus 200 m time in seconds)","CSS pace per 100 m (seconds) = 100 / CSS","Example: 400 m in 6:40 (400 s) and 200 m in 3:05 (185 s). CSS = 200 / 215 = 0.93 m/s, a pace of 1:47.5 per 100 m."]},{"t":"p","x":"Threshold sets are swum at CSS pace. Endurance sets sit 5 to 10 s per 100 m slower; sprints are maximal. Re-test CSS every 4 to 6 weeks."},{"t":"h2","x":"6.4 Swim Progression Levels"},{"t":"table","h":["Level","Standard","Training focus"],"r":[["1: Induction","200 m continuous freestyle; 5 min tread","Technique, breathing rhythm, water comfort."],["2: Cleared","400 m under 8:30 with bilateral breathing; 10 min tread","CSS sets, kick and pull strength, survival strokes."],["3: Operative","1,000 m continuous; 400 m under 7:00; tread with hands up","Open-water swimming, surf entries and exits, tows."],["4: Black Grade","2,000 m open water; 400 m under 6:00; run-swim-run; 50 m tow under 1:20","Rough water, surf sets, swimming clothed, swimming under fatigue."]]},{"t":"h2","x":"6.5 Breath Control and Breath-Hold Training"},{"t":"callout","title":"Breath-hold safety: non-negotiable","lines":["Shallow water blackout can occur without warning, even in strong swimmers.","Never hyperventilate (rapid or deep over-breathing) before a breath-hold.","Never practise breath-holds in water alone. In-water work (W-14) requires a dedicated spotter whose only job is to watch you.","Breath tables are done on land, seated or lying down, never while driving, and never in or beside water."]},{"t":"p","x":"Breath-hold capacity improves through tolerance to rising carbon dioxide and better oxygen economy, both of which also improve calm under stress. Measure a dry static maximum (seated, relaxed, after 2 minutes of calm breathing) and build the tables from it. Run each table no more than 2 to 3 times per week, never on the same day as each other."},{"t":"table","h":["Round","CO2 table: hold","CO2 table: rest","O2 table: hold","O2 table: rest"],"r":[["1","50% of max","2:00","40% of max","2:00"],["2","50%","1:45","45%","2:00"],["3","50%","1:30","50%","2:00"],["4","50%","1:15","55%","2:00"],["5","50%","1:00","60%","2:00"],["6","50%","0:45","65%","2:00"],["7","50%","0:30","70%","2:00"],["8","50%","0:15","75%","Finish"]]},{"t":"h2","x":"6.6 Surf Readiness"},{"t":"h1","x":"7. Combat Conditioning"},{"t":"h2","x":"7.1 Principles"},{"t":"p","x":"A few hard strikes mean little if the tank is empty after thirty seconds. Fights are repeated bursts of maximal effort (2 to 8 seconds) separated by brief, active recoveries, and the aerobic base decides how quickly power returns between bursts. KESTREL builds the engine, power, durability, and movement patterns; contact technique and sparring are learned under a qualified coach in boxing, kickboxing, Muay Thai, wrestling, judo, or Brazilian jiu-jitsu."},{"t":"h2","x":"7.2 Round Structures"},{"t":"table","h":["Format","Work and rest","Use"],"r":[["Aerobic rounds","20 to 30 min continuous at Z2 to Z3","Shadowboxing, rope, light bag work; builds the base."],["Striking rounds","5 to 12 x 3 min, 1 min rest","Bag or mitt combinations at fight pace."],["Burst rounds","3 min rounds with a 10 s all-out burst every 30 s","Repeated maximal efforts with active recovery."],["Sprint intervals","10 x 20 s all-out, 40 s easy","Bag, air bike, or sprawl-to-sprint; raises anaerobic power."],["Grappling rounds","3 to 6 x 5 min, 1 min rest","C-05, C-06, C-07, C-09, T-03, and sandbag work in sequence."]]},{"t":"h2","x":"7.3 Combat Readiness Progression"},{"t":"table","h":["Level","Standard"],"r":[["Cleared","5 x 3 min bag rounds with output held; 3 min continuous rope; 10 technical stand-ups each side without hands touching the face."],["Operative","8 x 3 min rounds with under 15% drop-off; 5 min continuous rope; 3 x 5 min grappling rounds."],["Black Grade","12 x 3 min rounds with under 10% drop-off; 10 min continuous rope including double-unders; 6 x 5 min grappling rounds."]]},{"t":"h1","x":"8. Training Methods"},{"t":"p","x":"This section gathers the methods that sit behind the programmes: bodyweight skill progressions, isometrics, plyometrics, neural speed work, conditioning formats, the training year, mind training, the mechanics every operative should understand, and tapering."},{"t":"h2","x":"8.1 Bodyweight Mastery Ladder"},{"t":"p","x":"Gymnastic strength gives total control of your own body: the ability to climb, vault, hang, invert, and get up and over anything. Master the static positions first (hollow, arch, support, and hang), then add movement. Practise skills fresh, for 10 minutes in the warm-up of two or three sessions per week, and use frequent submaximal sets through the day (about half your maximum) to build them faster."},{"t":"table","h":["Pattern","Cleared","Operative","Black Grade"],"r":[["Hang and pull","60 s dead hang; 8 strict pull-ups","5 chest-to-bar pull-ups; 4 m rope climb","Strict bar muscle-up; legless 4 m rope climb"],["Support and dip","30 s ring support","10 ring dips","3 strict ring muscle-ups"],["Inversion","60 s wall-facing handstand","5 wall handstand push-ups","10 m handstand walk"],["Single leg","5 pistols to a box per leg","3 full pistols per leg","5 pistols per leg holding 16 kg"],["Trunk","30 s hollow hold","60 s hollow hold; 20 hollow rocks","20 s L-sit on rings or parallel bars"],["Obstacle","1.8 m wall climb-up","2.2 m wall climb-up","Muscle-up onto a 2.4 m ledge"]]},{"t":"h2","x":"8.2 Isometric Strength"},{"t":"p","x":"Isometrics build strength with almost no joint movement, which makes them ideal for durability, for training around sore joints, for travel, and for breaking through sticking points. They have deep roots in martial arts conditioning, such as long horse-stance holds."},{"t":"h2","x":"8.3 Plyometrics and the Shock Method"},{"t":"p","x":"The shock method was developed by Soviet sports scientist Yuri Verkhoshansky. It uses the energy of a short fall to load the muscles eccentrically, then demands an immediate, explosive reversal. Depth drops (K-08) and drop-catch push-ups (K-13) are its main KESTREL forms."},{"t":"h2","x":"8.4 Neural Speed"},{"t":"p","x":"Speed is a nervous-system quality as much as a muscular one. The twitch drill (K-12), short sprints, rope work (C-01), and reaction drills (C-10) train fast motor-unit firing and coordination. Keep efforts under 10 seconds, rest fully, and put them early in the session while the body is fresh."},{"t":"h2","x":"8.5 Pyramids and Conditioning Formats"},{"t":"table","h":["Format","Structure","KESTREL example"],"r":[["Pyramid","Reps climb by one each step, then back down","The Pyramid operation: pull-ups 1 to 10 to 1, with push-ups and hollow rocks"],["Top pyramid","Load rises and reps fall each set to a heavy top set, then back down","Front squat 8, 6, 4, 2, 4, 6, 8 at rising then falling loads"],["AMRAP","As many rounds as possible in a fixed time","Safe House"],["EMOM","A set at the start of each minute","Kettlebell swings or snatches, 10 to 20 min"],["Ladder","Add one rep (or one movement) each round","Burpees plus one each minute until failure to keep pace"],["Chipper","A long list of movements completed once","Black Site (deck of cards)"],["Intervals","Fixed work and rest periods","Burst rounds, 400 m repeats, CSS swim sets"]]},{"t":"p","x":"Keep technically demanding lifts (snatches, cleans, jerks) at low reps with good rest. High-rep, timed circuits use simple movements whose technique holds up under fatigue."},{"t":"h2","x":"8.6 The Training Year"},{"t":"p","x":"Rotate emphasis with the seasons while keeping every pillar alive all year. Seasons below are for the Southern Hemisphere; reverse them in the north."},{"t":"table","h":["Season","Emphasis","Maintain"],"r":[["Summer (December to February)","Surf, open water, speed, and athletics","Strength (two sessions), combat (one session)"],["Autumn (March to May)","Strength and bodyweight mastery","Pool swimming, rucking"],["Winter (June to August)","Combatives, strength, and pool work","Aerobic base, mobility"],["Spring (September to November)","Endurance, rucking, and the return to open water","Strength, combat"]]},{"t":"p","x":"Once per quarter, run a **Pentathlon Day**: 100 m sprint, standing broad jump, overhead backward throw, 400 m swim, and 2.4 km run, scored against your personal bests. In groups, add team relays and obstacle relays for competition and morale."},{"t":"h2","x":"8.7 Mind Training"},{"t":"h2","x":"8.8 Mechanics for Operatives"},{"t":"h2","x":"8.9 Tapering"},{"t":"p","x":"Before a test, selection, or major event, cut training volume by 40 to 60 percent over the final one to three weeks while keeping intensity and frequency. Longer tapers suit endurance events and heavy training blocks; one week suits a routine re-test. The Debrief week in each block is a one-week taper."},{"t":"h1","x":"9. Weekly Programmes"},{"t":"p","x":"Choose the template that matches the days you can train consistently. Values shown are a typical Hardening-phase week; Section 10 sets the progression. The Daily Joint Integrity Routine (4.2) runs every day in addition, and Bodyweight Mastery skills (8.1) are practised for 10 minutes in the warm-up of two sessions per week."},{"t":"h2","x":"9.1 Three-Day Programme"},{"t":"p","x":"For Recruits, busy weeks, and periods of heavy work or study. Monday, Wednesday, and Friday, with an optional fourth Field session at the weekend (ruck, surf, or a Signature Operation)."},{"t":"h3","x":"Day 1: Lower Strength, Kinetic, and Evasion"},{"t":"table","h":["#","Movement","Sets x Reps","Intensity","Rest"],"r":[["A1","V-04 Precision jump","3 x 5","Silent landings","30 s"],["A2","K-01 Broad jump to stick","4 x 3","Max intent","90 s"],["B","S-01 Front squat","4 x 5","RPE 7 to 8","2 to 3 min"],["C","S-06 Rear-foot-elevated split squat","3 x 8 per leg","RPE 7","90 s"],["D","S-08 Nordic hamstring curl","3 x 4","Controlled","2 min"],["E","L-02 Farmer's carry","4 x 40 m","Heavy","90 s"],["F","R-04 Copenhagen plank","3 x 20 s per side","Steady","30 s"]]},{"t":"h3","x":"Day 2: Water and Engine"},{"t":"table","h":["#","Movement","Sets x Reps","Intensity","Rest"],"r":[["A","Warm-up and W-01 drills","400 m + 8 x 25 m","Easy","15 s"],["B","W-03 CSS threshold set","8 x 100 m","CSS pace","15 s"],["C","W-04 Sprint swim","6 x 25 m","All-out","60 s"],["D","W-05 Kick set","4 x 50 m","Moderate","15 s"],["E","W-07 Eggbeater and sculling","3 x 1 min","Hands up final 20 s","1 min"],["F","Warm-down","200 m","Easy","N/A"]]},{"t":"h3","x":"Day 3: Upper Strength and Combat"},{"t":"table","h":["#","Movement","Sets x Reps","Intensity","Rest"],"r":[["A","K-02 Russian kettlebell swing","5 x 12","RPE 7","60 s"],["B","S-03 Weighted pull-up","4 x 5","RPE 8","2 min"],["C","S-04 Standing overhead press","4 x 5","RPE 7 to 8","2 min"],["D1","S-07 Single-arm dumbbell row","3 x 10 per arm","RPE 8","60 s"],["D2","S-05 Weighted dip","3 x 8","RPE 8","60 s"],["E","C-01 Jump rope","3 x 3 min","Moderate","1 min"],["F","T-01 Heavy bag rounds","5 x 3 min","Hard","1 min"],["G","R-21 Plate shoulder circuit","2 rounds","Easy to moderate","N/A"]]},{"t":"h2","x":"9.2 Four-Day Programme"},{"t":"p","x":"The standard KESTREL week: Monday, Tuesday, Thursday, and Saturday. Saturday rotates through four Field days."},{"t":"h3","x":"Monday: Lower Strength and Power"},{"t":"table","h":["#","Movement","Sets x Reps","Intensity","Rest"],"r":[["A1","K-08 Depth drop to vertical jump","4 x 3","Max intent","90 s"],["A2","K-11 Plate pivot rotation","3 x 20 s","Fast","40 s"],["B","S-02 Trap bar deadlift","4 x 4","RPE 8","3 min"],["C","S-06 Rear-foot-elevated split squat","3 x 8 per leg","RPE 7 to 8","90 s"],["D","S-08 Nordic hamstring curl","3 x 5","Controlled","2 min"],["E","L-03 Suitcase carry","3 x 30 m per side","Heavy","60 s"],["F","R-13 Spanish squat isometric","3 x 45 s","Strong","90 s"]]},{"t":"h3","x":"Tuesday: Water"},{"t":"table","h":["#","Movement","Sets x Reps","Intensity","Rest"],"r":[["A","Warm-up and W-01 drills","400 m + 8 x 25 m","Easy","15 s"],["B","W-02 Bilateral breathing set","4 x 100 m","Moderate","20 s"],["C","W-03 CSS threshold set","10 x 100 m","CSS pace","15 s"],["D","W-06 Pull set","4 x 100 m","Moderate","20 s"],["E","W-08 survival strokes or W-15 combat sidestroke, then W-07 tread","4 x 50 m, then 3 x 1 min","Steady","30 s"],["F","Optional land finisher: E-03 400 m repeats","6 x 400 m","Z4","90 s"]]},{"t":"h3","x":"Thursday: Upper Strength and Combat"},{"t":"table","h":["#","Movement","Sets x Reps","Intensity","Rest"],"r":[["A","K-04 Medicine ball rotational throw","4 x 5 per side","Max intent","60 s"],["B","S-03 Weighted pull-up","5 x 4","RPE 8","2 min"],["C","S-04 Standing overhead press","4 x 5","RPE 8","2 min"],["D1","S-07 Single-arm dumbbell row","3 x 10 per arm","RPE 8","60 s"],["D2","S-05 Weighted dip","3 x 6","RPE 8","60 s"],["E","T-01 Heavy bag (burst rounds)","6 x 3 min","Hard","1 min"],["F","C-05 Hip escape, C-07 technical stand-up","3 x 15 m; 3 x 6 per side","Technical","45 s"],["G","T-09 Wrist complex, then R-21 plate shoulder circuit","2 rounds each","Moderate","N/A"]]},{"t":"h3","x":"Saturday: Field Day Rotation"},{"t":"table","h":["Week","Field day","Content"],"r":[["A","Load","L-01 ruck march (Section 10 loads), then L-05 ruck step-ups 3 x 12 per leg."],["B","Evasion and Engine","V-02 climb-ups 6; V-03 vaults 3 x 5 per side; V-07 low crawl 4 x 15 m; E-04 Pursuit fartlek 30 min."],["C","Surf","W-11 soft-sand sprints 6 x 40 m; W-09 dolphin dives 4 sets; W-10 surf entries and body surfing 20 min; W-12 run-swim-run 1 round."],["D","Operation","Any Signature Operation from Section 11."]]},{"t":"h2","x":"9.3 Five-Day Programme"},{"t":"p","x":"For Operative and Black Grade trainees with full recovery resources: sleep, food, and time. Wednesday and Sunday are recovery days."},{"t":"table","h":["Day","Focus","Content"],"r":[["Monday","Lower Strength and Power","As 4-day Monday, then K-05 hill sprints 6 x 10 s."],["Tuesday","Water A: Threshold","As 4-day Tuesday."],["Wednesday","Recovery (optional)","E-01 Zone 2 run 40 min or easy 1,500 m swim; land breath table (6.5); full Resilience circuit."],["Thursday","Upper Strength and Combat","As 4-day Thursday, plus C-03 roundhouse kicks 3 x 2 min."],["Friday","Total-Body Power and Evasion","K-12 twitch drill 4 x 10 s; K-13 plyometric push-up 4 x 5; K-03 sandbag clean 5 x 3; K-07 pro agility 6; T-07 sandbag over-shoulder 5 x 5; L-07 sled push 6 x 20 m; V-02 climb-ups 6; T-03 sprawl to sprint 8."],["Saturday","Water B or Field","Alternate: open water or surf session (W-09 to W-12, W-13 tows) and the Saturday Field rotation from 9.2."],["Sunday","Rest","Walk, Joint Integrity Routine, sleep. Optional Debrief operation."]]},{"t":"h1","x":"10. Periodisation"},{"t":"p","x":"Each block moves through four phases. The weekly templates stay the same; the tables change sets, reps, intensity, run and swim focus, and ruck parameters. 'Main lift' applies to the first compound lift of each strength session; accessories follow the same trend at higher reps. Combat rounds increase by one round every second week, dropping back in unload weeks."},{"t":"h2","x":"10.1 Phases"},{"t":"table","h":["Phase","Intent","Emphasis"],"r":[["Induction","Build the base and groove technique.","Higher reps at moderate RPE, Zone 2 volume, swim technique, light rucks, Evasion skills at low intensity."],["Hardening","Raise strength and work capacity.","Fewer reps, heavier loads, threshold and VO2max intervals on land and in water, heavier rucks."],["Field Readiness","Convert capacity into performance.","Low-rep heavy strength, full-speed Kinetic, sprint swims, surf work, Signature Operations, peak ruck."],["Debrief","Absorb the block and re-test.","Volume down 40 to 50 percent, moderate intensity, Selection Assessment at week's end."]]},{"t":"h2","x":"10.2 Six-Week Block"},{"t":"table","h":["Wk","Phase","Main lift","RPE","Run","Swim main set","Ruck km/kg","Notes"],"r":[["1","Induction","3 x 8","6 to 7","Z2, strides","Drills, 6 x 100 easy","4 / 10","Selection Assessment"],["2","Induction","4 x 6","7","Z2, tempo 2 x 8 min","6 x 100 CSS","5 / 10",""],["3","Hardening","5 x 5","7 to 8","400 m x 6","8 x 100 CSS","6 / 10",""],["4","Hardening","5 x 4","8","400 m x 8","10 x 100 CSS","6 / 12",""],["5","Field Readiness","4 x 3","8 to 9","Pursuit fartlek","Sprints + open water","7 / 12","Signature Operation"],["6","Debrief","2 x 3","5 to 6","Easy Z2","1,000 m easy","4 / 10","Re-test"]]},{"t":"h2","x":"10.3 Eight-Week Block"},{"t":"table","h":["Wk","Phase","Main lift","RPE","Run","Swim main set","Ruck km/kg","Notes"],"r":[["1","Induction","3 x 8","6 to 7","Z2, strides","Drills, 6 x 100 easy","4 / 10","Selection Assessment"],["2","Induction","4 x 6","7","Z2, tempo 2 x 8 min","6 x 100 CSS","5 / 10",""],["3","Induction","4 x 6","7","Tempo 3 x 8 min","8 x 100 CSS","6 / 10",""],["4","Hardening","5 x 5","7 to 8","400 m x 6","10 x 100 CSS","6 / 12",""],["5","Hardening","5 x 4","8","400 m x 8","5 x 200 CSS","7 / 12",""],["6","Field Readiness","4 x 3","8 to 9","Pursuit fartlek","Sprints + surf","8 / 12","Signature Operation"],["7","Field Readiness","3 x 2 + single","9","Tempo 20 min","Run-swim-run","6 / 14","Peak Operation"],["8","Debrief","2 x 3","5 to 6","Easy Z2","1,000 m easy","4 / 10","Re-test"]]},{"t":"h2","x":"10.4 Twelve-Week Block"},{"t":"p","x":"The full KESTREL progression, with an unload week every fourth week."},{"t":"table","h":["Wk","Phase","Main lift","RPE","Run","Swim main set","Ruck km/kg","Notes"],"r":[["1","Induction","3 x 8","6 to 7","Z2, strides","Drills, 6 x 100 easy","4 / 10","Selection Assessment"],["2","Induction","4 x 8","7","Z2, strides","Drills, 8 x 100 easy","5 / 10",""],["3","Induction","4 x 6","7","Z2, tempo 2 x 8 min","6 x 100 CSS","6 / 10",""],["4","Induction","3 x 6","6","Z2 only","800 m easy","4 / 10","Unload"],["5","Hardening","4 x 5","7 to 8","Tempo 3 x 8 min","8 x 100 CSS","6 / 12",""],["6","Hardening","5 x 5","8","400 m x 6","10 x 100 CSS","7 / 12",""],["7","Hardening","5 x 4","8","400 m x 8","5 x 200 CSS","8 / 12",""],["8","Hardening","3 x 4","6","Z2 only","1,000 m easy","5 / 10","Unload"],["9","Field Readiness","4 x 3","8 to 9","400 m x 10","12 x 100 CSS + sprints","8 / 14","Signature Operation"],["10","Field Readiness","5 x 3","8 to 9","Pursuit fartlek","Surf or open water","10 / 14","Optional: Long Walk"],["11","Field Readiness","3 x 2 + single","9","Tempo 20 min","Run-swim-run","8 / 16","Peak Operation"],["12","Debrief","2 x 3","5 to 6","Easy Z2","1,000 m easy","5 / 10","Re-test"]]},{"t":"h2","x":"10.5 Progression Rules"},{"t":"h1","x":"11. Signature Operations"},{"t":"p","x":"Signature Operations are themed sessions that test several pillars at once across every environment: streets, playgrounds, hotel rooms, pools, and surf beaches. Run one every fourth week in the 4-day programme, every second week in the 5-day programme, or in place of a Field day. Each has a standard to chase from block to block."},{"t":"h1","x":"12. Monitoring and Recovery Essentials"},{"t":"p","x":"Full nutrition and recovery guidance is reserved for a later volume. The essentials below keep training productive and injuries rare."},{"t":"h2","x":"12.1 Daily Readiness Check"},{"t":"table","h":["Marker","Green","Amber","Red"],"r":[["Sleep","7.5 h or more","6 to 7.5 h","Under 6 h"],["Resting heart rate vs 7-day average","Within 3 bpm","4 to 7 bpm higher","8 bpm or more higher"],["Muscle soreness (1 to 5)","1 to 2","3","4 to 5"],["Motivation and mood","Keen","Flat","Dreading it"],["Pain (joints, spine, tendons)","None","Niggle up to 3/10","Over 3/10 or worsening"]]},{"t":"h2","x":"12.2 Load Management"},{"t":"h2","x":"12.3 Body Composition Tracking"},{"t":"h2","x":"12.4 Recovery Basics"},{"t":"h2","x":"12.5 Training Log"},{"t":"table","h":["Date","Session","Key lifts (kg x reps)","Run / ruck / swim","sRPE","Ready","Notes"],"r":[["","","","","","",""],["","","","","","",""],["","","","","","",""],["","","","","","",""],["","","","","","",""],["","","","","","",""],["","","","","","",""]]},{"t":"h1","x":"13. References"}],"cards":[{"id":"K-01","name":"Broad Jump to Stick","equip":"None","purpose":"Horizontal power and safe landing mechanics.","cues":["Hips back, arms swing hard behind you, then drive them forward and up.","Jump out and slightly up for maximum distance.","Land soft and quiet with knees tracking over toes; hold the landing for two seconds."],"dose":"4 to 6 sets of 3 jumps, full rest (60 to 90 s).","prog":"Consecutive bounding jumps; add a 5 m sprint after landing.","reg":"Box or line jump of half distance.","street":"Jump across painted lines or cracks on a footpath.","g":"K"},{"id":"K-02","name":"Russian Kettlebell Swing","equip":"Kettlebell 16 to 32 kg","purpose":"Explosive hip extension and posterior-chain power endurance.","cues":["Hike the bell back high between the thighs like a football snap.","Snap the hips through and squeeze the glutes; the arms stay relaxed like ropes.","Bell floats to chest height; brace the trunk at the top."],"dose":"5 to 10 sets of 10 to 15 reps, or EMOM 10 to 20 min.","prog":"Heavier bell; single-arm swings; hand-to-hand switches.","reg":"Hip hinge drill against a wall; lighter bell.","street":"Backpack swing with a loaded pack held by the grab handle.","g":"K"},{"id":"K-03","name":"Sandbag Clean","equip":"Sandbag 20 to 50 kg","purpose":"Triple extension with an awkward, shifting object.","cues":["Straddle the bag, grip the material or handles, flat back.","Pull it to the hips, then explode the hips and catch it in the lap or chest.","Stand tall, then return under control."],"dose":"5 sets of 3 to 5 reps.","prog":"Clean to shoulder; clean and press.","reg":"Sandbag deadlift; lighter bag.","street":"Clean a duffel or pack filled with water bottles.","g":"K"},{"id":"K-04","name":"Medicine Ball Rotational Throw","equip":"Medicine ball 3 to 6 kg, solid wall","purpose":"Rotational power for striking, throwing, and shoving.","cues":["Stand side-on to the wall, load the back hip.","Rotate from the ground up: foot, hip, trunk, then arms.","Throw with intent; catch the rebound and reset."],"dose":"4 sets of 5 per side.","prog":"Step-behind throw; heavier ball.","reg":"Half-kneeling throw; band rotation.","street":"Band or towel rotational pulls anchored to a post.","g":"K"},{"id":"K-05","name":"Hill Sprint","equip":"Hill of 6 to 10 percent gradient","purpose":"Maximal acceleration with low impact and built-in good mechanics.","cues":["Drive knees forward and punch the ground behind you.","Tall posture with a slight lean from the ankles.","Walk back down for full recovery."],"dose":"6 to 10 sprints of 8 to 12 s; walk-back recovery.","prog":"Longer sprints (15 to 20 s); steeper hill.","reg":"Strides at 80 percent on flat ground.","street":"Steep streets, stairways, or grass embankments.","g":"K"},{"id":"K-06","name":"Lateral Bound","equip":"None","purpose":"Lateral power and single-leg landing stability.","cues":["Push off the outside foot and bound sideways.","Land on the opposite foot, hip back, knee stable.","Stick for one second before bounding back."],"dose":"3 to 4 sets of 6 per side.","prog":"Continuous bounds; add a mini hurdle.","reg":"Lateral step and hold.","street":"Bound between painted parking lines.","g":"K"},{"id":"K-07","name":"5-10-5 Pro Agility Shuttle","equip":"Three markers 5 m apart","purpose":"Deceleration, change of direction, and re-acceleration.","cues":["Start in the middle, sprint 5 m right and touch the line.","Plant, drop the hips, and drive back 10 m to the far line.","Turn and sprint 5 m through the start."],"dose":"6 to 8 reps, 60 s rest. Test standard under 5.0 s.","prog":"Reactive start on a partner's call or clap.","reg":"Walk-through of the plant and turn at half speed.","street":"Use kerbs, lampposts, or bins as markers.","g":"K"},{"id":"K-08","name":"Depth Drop to Vertical Jump","equip":"Box or step 30 to 45 cm","purpose":"Reactive strength and stiffness of the lower limb.","cues":["Step off the box and let yourself drop.","Land and immediately rebound into a maximal jump.","Minimise ground contact; think of the ground as hot."],"dose":"3 to 5 sets of 3 reps, full rest. Maximum 30 contacts per session.","prog":"Higher box (in 5 cm steps) only if contact time stays short.","reg":"Depth drop and stick, no rebound.","street":"Step off a low wall or park bench.","g":"K"},{"id":"K-09","name":"Medicine Ball Slam","equip":"Slam ball 6 to 12 kg (non-bouncing)","purpose":"Total-body power from overhead to floor; a safe way to hit hard with full intent.","cues":["Rise onto the toes with the ball overhead and the body long.","Slam it down just in front of the feet by driving the hips back and the arms through.","Catch or pick up with a flat back and repeat."],"dose":"4 to 6 sets of 5 to 8 reps, full intent.","prog":"Rotational slams to each side; heavier ball.","reg":"Lighter ball, smaller range.","street":"Heavy sandbag dropped from overhead onto grass.","g":"K"},{"id":"K-10","name":"Overhead Backward Throw","equip":"Medicine ball 3 to 5 kg, open field","purpose":"Triple extension and posterior-chain power; doubles as a throwing test.","cues":["Stand facing away from the throwing direction, ball held low between the legs.","Dip, then drive the hips through and swing the arms straight overhead.","Release behind you at about 45 degrees and let the body follow."],"dose":"4 sets of 3 throws.","prog":"Heavier ball; measure distance each session.","reg":"Underhand forward scoop toss.","street":"Any field or beach with a sandbag or ball.","g":"K"},{"id":"K-11","name":"Plate Pivot Rotation","equip":"Weight plate 10 to 20 kg","purpose":"Rotational power and conditioning driven from the hips: a spine-friendly alternative to seated twists.","cues":["Hold the plate at the chest in an athletic stance.","Pivot the rear foot and turn the hips, then snap the plate across the body to the other side.","Keep the ribs over the pelvis; the rotation comes from the feet and hips."],"dose":"4 x 20 to 30 s fast, or 3 x 10 per side controlled.","prog":"Add a step or shuffle between turns; longer rounds.","reg":"Lighter plate, slower tempo.","street":"Rock, sandbag, or water jug held at the chest.","g":"K"},{"id":"K-12","name":"Twitch Drill","equip":"Back-extension bench or bench with a partner; two light weights 1 to 2 kg","purpose":"Neural speed: rapid alternating arm drives that train fast motor-unit firing and coordination.","cues":["Lie prone, chest supported, a light weight in each hand.","Drive one arm forward fast while the other pulls back, alternating as quickly as possible.","Stay crisp and relaxed; stop the set the moment speed drops."],"dose":"4 to 6 x 10 s, full rest.","prog":"Vary the planes: forward, sideways, diagonals.","reg":"No weights; fast alternating punches standing.","street":"Fast alternating punches or arm drives lying on a bench.","g":"K"},{"id":"K-13","name":"Plyometric Push-Up","equip":"None; optional box for decline","purpose":"Upper-body explosiveness and fast eccentric absorption.","cues":["Lower under control, then push the floor away hard enough to leave it.","Land with soft elbows and flow straight into the next rep.","Brace the trunk so the body moves as one piece."],"dose":"4 sets of 3 to 6 reps, full rest.","prog":"Clap; decline clapping (feet on a box); drop-catch from a raised position.","reg":"Incline plyometric push-up from a bench.","street":"Any flat ground; soft surface for early learning.","g":"K"},{"id":"K-14","name":"Kettlebell Snatch","equip":"Kettlebell 16 to 24 kg","purpose":"Explosive hip power and grip endurance; one of the best single-implement conditioning tools.","cues":["Swing the bell back between the legs, then snap the hips.","Pull the bell close and punch the hand through at the top so the bell rolls softly onto the forearm.","Lock out overhead, then drop the bell back into the swing."],"dose":"5 x 5 per arm, or 5 min continuous switching hands as needed.","prog":"Snatch test: 100 reps in 5 min with 24 kg.","reg":"High pull; single-arm swing.","street":"Dumbbell snatch.","g":"K"},{"id":"K-15","name":"Dumbbell Power Jerk","equip":"Dumbbells","purpose":"Leg drive transferred overhead: power that moves loads up to height.","cues":["Dumbbells on the shoulders, short sharp dip at the knees.","Drive explosively and punch the weights up while re-bending the knees to catch.","Stand up with the arms locked."],"dose":"5 x 3 to 5.","prog":"Split jerk stance; heavier load.","reg":"Push press.","street":"Sandbag or pack push press.","g":"K"},{"id":"E-01","name":"Zone 2 Run","equip":"Running shoes","purpose":"Aerobic base, capillary density, and fat oxidation.","cues":["Conversational pace: you can speak full sentences.","Roughly 60 to 70 percent of maximum heart rate, RPE 3 to 4.","Relaxed shoulders, quick light steps, nasal breathing where possible."],"dose":"30 to 75 min, 1 to 3 times per week.","prog":"Add 5 to 10 min per week; trail terrain.","reg":"Run/walk intervals (4 min run, 1 min walk).","street":"Urban loops; vary routes and times so the habit stays fresh.","g":"E"},{"id":"E-02","name":"Threshold Tempo Run","equip":"Running shoes","purpose":"Raises lactate threshold, the pace you can hold hard for long.","cues":["Comfortably hard: RPE 6 to 7; speech limited to short phrases.","Hold an even pace throughout.","10 min easy warm-up and cool-down."],"dose":"2 to 4 blocks of 8 to 10 min, 2 min jog between; or 20 to 30 min continuous.","prog":"Lengthen blocks; reduce rest.","reg":"3 to 4 blocks of 5 min.","street":"Flat waterfront or a park loop of known distance.","g":"E"},{"id":"E-03","name":"400 m Repeats","equip":"Track or measured 400 m","purpose":"VO2max and repeat-effort speed.","cues":["Run each repeat at your current 2.4 km test pace or slightly faster.","Even splits; the last should match the first.","Jog or walk 200 m between repeats."],"dose":"6 to 10 x 400 m, 90 to 120 s recovery.","prog":"Shorter recovery; 600 m or 800 m repeats.","reg":"200 m repeats.","street":"Measure a block or straight with a GPS watch.","g":"E"},{"id":"E-04","name":"Pursuit Fartlek","equip":"None","purpose":"Unstructured speed changes that mimic chase and evasion.","cues":["Run easy, then surge to a landmark (lamppost, corner, tree).","Surges range from 10 s to 2 min, at varied intensities.","Recover to easy running; never stop."],"dose":"25 to 45 min total with 8 to 15 surges.","prog":"More surges, harder, on hillier routes.","reg":"Fewer surges, longer recoveries.","street":"Built for the street: use whatever the route throws at you.","g":"E"},{"id":"E-05","name":"Stair Climb Intervals","equip":"Stairwell or outdoor stairs","purpose":"Leg endurance, cardiovascular power, and climbing economy.","cues":["Drive through the whole foot, one step at a time for power, two for stride.","Upright torso; light hands on the rail only for safety.","Walk down for recovery."],"dose":"8 to 15 climbs of 30 to 90 s.","prog":"Wear a 10 to 15 kg pack; take two steps at a time.","reg":"Fewer climbs; walk at a steady pace.","street":"Public stairways, stadium steps, car-park stairwells.","g":"E"},{"id":"E-06","name":"Air Bike Intervals","equip":"Air bike (fan bike)","purpose":"Whole-body high-intensity conditioning with no impact.","cues":["Push and pull with the arms while driving the legs.","Sit tall, brace the trunk.","Go all out on work intervals; spin easy on rest."],"dose":"10 x 20 s hard / 40 s easy; or 5 x 1 min hard / 2 min easy.","prog":"Extend work intervals; shorten rest.","reg":"Steady 15 to 20 min at RPE 5.","street":"Hill sprints or burpee intervals replace the bike.","g":"E"},{"id":"E-07","name":"Rowing 500 m Intervals","equip":"Rowing ergometer","purpose":"Posterior-chain endurance and pulling capacity.","cues":["Legs, then back, then arms on the drive; reverse on the recovery.","Ratio of roughly one count driving to two counts recovering.","Hold a consistent split."],"dose":"4 to 6 x 500 m, 2 min rest.","prog":"1,000 m repeats; lower split targets.","reg":"250 m repeats.","street":"Band rows or a loaded pack row for timed sets.","g":"E"},{"id":"E-08","name":"Swim Intervals","equip":"Pool or open water with supervision","purpose":"Aquatic endurance, breath control, and water confidence.","cues":["Long body line, head neutral, breathe every 2 to 3 strokes.","Mix freestyle with breaststroke and survival backstroke.","Never train alone in open water."],"dose":"10 x 50 m on a 75 s cycle, or 4 x 200 m, 30 s rest.","prog":"Longer repeats; hypoxic sets (breathe every 5 strokes), within safe limits.","reg":"25 m repeats with full rest.","street":"Patrolled beach swims inside the flags with a buddy.","g":"E"},{"id":"S-01","name":"Front Squat","equip":"Barbell and rack","purpose":"Quadriceps, upper-back, and trunk strength with an upright torso.","cues":["Bar on the front of the shoulders, elbows high.","Sit between the hips, knees forward over toes, chest up.","Drive up through the whole foot."],"dose":"4 to 5 sets of 3 to 6 reps at RPE 7 to 8.","prog":"Add 2.5 kg per week while bar speed holds.","reg":"Goblet squat with a kettlebell or dumbbell.","street":"Sandbag or pack front squat (bear-hug hold).","g":"S"},{"id":"S-02","name":"Trap Bar Deadlift","equip":"Trap (hex) bar","purpose":"Total-body pulling strength with a back-friendly profile.","cues":["Stand in the centre, hinge and grip the handles.","Chest proud, lats tight, slack pulled out of the bar.","Push the floor away; lock out by squeezing the glutes with the ribs down."],"dose":"3 to 5 sets of 3 to 5 reps at RPE 7 to 8.","prog":"Add 2.5 to 5 kg per week; occasional heavy single at RPE 9.","reg":"Kettlebell deadlift from a block.","street":"Sandbag or loaded-pack deadlift.","g":"S"},{"id":"S-03","name":"Weighted Pull-Up","equip":"Bar, belt or vest","purpose":"Vertical pulling strength; the operative's climbing engine.","cues":["Full hang to chin over bar.","Pull the elbows to the ribs, chest towards the bar.","Control the descent for 2 seconds."],"dose":"4 to 5 sets of 3 to 6 reps.","prog":"Add 1.25 to 2.5 kg per week; L-sit pull-ups.","reg":"Bodyweight pull-ups, band-assisted, or slow negatives.","street":"Park bars, scaffolding, or a sturdy tree branch, with a loaded pack.","g":"S"},{"id":"S-04","name":"Standing Overhead Press","equip":"Barbell, dumbbells, or kettlebells","purpose":"Overhead strength and trunk stiffness.","cues":["Squeeze glutes and brace; ribs down.","Press the bar in a straight line, head moving back then through.","Finish with the bar over the mid-foot, biceps by the ears."],"dose":"4 sets of 4 to 6 reps at RPE 7 to 8.","prog":"Push press for overload; single-arm kettlebell press.","reg":"Half-kneeling landmine press.","street":"Sandbag or pack overhead press; pike push-ups.","g":"S"},{"id":"S-05","name":"Weighted Dip","equip":"Parallel bars, belt","purpose":"Horizontal-to-vertical pushing strength for chest, shoulders, and triceps.","cues":["Lean slightly forward, shoulders packed down.","Lower until the upper arm is about parallel.","Press to full lockout without shrugging."],"dose":"3 to 4 sets of 5 to 8 reps.","prog":"Add load; ring dips.","reg":"Bodyweight dips or deficit push-ups.","street":"Park parallel bars, two sturdy benches, or a playground frame.","g":"S"},{"id":"S-06","name":"Rear-Foot-Elevated Split Squat","equip":"Bench, dumbbells","purpose":"Single-leg strength and asymmetry correction.","cues":["Back foot laces-down on a bench, front foot a long stride ahead.","Drop the back knee straight down; front shin roughly vertical.","Drive up through the front heel and mid-foot."],"dose":"3 sets of 6 to 10 per leg. Start with the weaker leg.","prog":"Heavier dumbbells; 1.5-rep version.","reg":"Static split squat with the back foot on the floor.","street":"Park bench with a loaded pack.","g":"S"},{"id":"S-07","name":"Single-Arm Dumbbell Row","equip":"Dumbbell, bench","purpose":"Horizontal pulling, lat and mid-back strength, anti-rotation.","cues":["Hand and knee on the bench, flat back.","Pull the elbow back towards the hip.","Pause at the top, lower under control."],"dose":"3 to 4 sets of 8 to 12 per arm.","prog":"Heavier dumbbell; kroc-style higher reps.","reg":"Supported cable or band row.","street":"Inverted rows under a park bar or table.","g":"S"},{"id":"S-08","name":"Nordic Hamstring Curl","equip":"Partner, bench strap, or anchor","purpose":"Eccentric hamstring strength; strongly protective against sprint strains.","cues":["Kneel tall with heels anchored.","Lower forward slowly with hips extended, resisting the whole way.","Catch with the hands, push back up lightly."],"dose":"2 to 3 sets of 3 to 6 reps, 2 times per week.","prog":"Slower lowering; hands-free return.","reg":"Band-assisted Nordics; partial range; slider or towel leg curls on a smooth floor.","street":"Hook heels under a low park bar or bench.","g":"S"},{"id":"S-09","name":"Rope Climb","equip":"Climbing rope 4 to 6 m, mats","purpose":"Pulling strength, grip, and climbing technique for ropes, ledges, and cargo nets.","cues":["Pinch the rope between the feet (or wrap one foot) to stand on it.","Reach high, lock the feet, and stand up; repeat.","Climb down hand under hand under control."],"dose":"3 to 5 ascents.","prog":"Legless climbs; climbs with a weighted vest.","reg":"Seated rope pulls to standing; lying rope pulls.","street":"Knotted rope on a sound tree limb, with supervision and soft ground.","g":"S"},{"id":"S-10","name":"Muscle-Up","equip":"Bar or rings","purpose":"Pull and press combined: the movement that gets you up and over a ledge.","cues":["Start from a hollow body hang; pull explosively to the lower chest.","Turn the wrists and shoulders over the bar quickly.","Press to straight arms in the support position."],"dose":"3 to 5 sets of 1 to 3, technique first.","prog":"Strict muscle-up; ring muscle-up.","reg":"Chest-to-bar pull-ups, straight-bar dips, and band-assisted transitions.","street":"Park or playground bar.","g":"S"},{"id":"S-11","name":"Pistol Squat","equip":"None; optional box or counterweight","purpose":"Single-leg strength, balance, and ankle mobility through full range.","cues":["Stand on one leg, the other reaching forward.","Sit down and back under control, heel down, knee tracking over the toes.","Stand up without bouncing off the bottom."],"dose":"3 to 4 x 3 to 6 per leg.","prog":"Weighted pistols; slow tempo.","reg":"Pistol to a box; holding a post; counterweight held forward.","street":"Park bench as the box.","g":"S"},{"id":"S-12","name":"Handstand Push-Up","equip":"Wall","purpose":"Vertical pressing strength using bodyweight; shoulder strength and control upside down.","cues":["Kick up to a wall handstand, hands just wider than the shoulders.","Lower the head to the floor in a tripod position.","Press back to straight arms, ribs tucked."],"dose":"4 to 5 sets of 2 to 6.","prog":"Deficit handstand push-ups; freestanding.","reg":"Pike push-ups with feet raised; wall-facing holds.","street":"Any sturdy wall.","g":"S"},{"id":"S-13","name":"Overcoming Isometrics","equip":"Barbell under rack pins, strap, or immovable object","purpose":"Maximal force at a chosen joint angle with very low joint stress; ideal for strength without wear.","cues":["Set the position (quarter squat, mid-thigh pull, press at the sticking point).","Build to maximal effort over 1 to 2 s and push or pull as hard as possible.","Hold, breathe out in short bursts, then release smoothly."],"dose":"3 to 5 x 5 to 10 s per position, 1 to 2 min rest.","prog":"Two or three joint angles per lift.","reg":"Submaximal effort (70 to 80 percent).","street":"Pull up on a fixed bar or push against a wall or doorframe.","g":"S"},{"id":"S-14","name":"Yielding Isometric Holds","equip":"Bodyweight or a loaded bag","purpose":"Positional strength, tendon conditioning, and mental endurance: horse stance, wall sit, split squat hold, Zercher hold, and overhead hold.","cues":["Find the position and lock in good alignment.","Hold still, breathe slowly, and stay tall.","End the set when form slips, before it breaks down."],"dose":"3 to 5 x 30 to 90 s.","prog":"Add load; lower positions; longer holds.","reg":"Higher positions, shorter holds.","street":"Wall sits and horse stance anywhere.","g":"S"},{"id":"S-15","name":"Suspension Row and Fallout","equip":"Suspension trainer anchored to a door, bar, or tree","purpose":"Portable pulling and anti-extension strength for travel and outdoor training.","cues":["Row: body straight, pull the hands to the ribs, squeeze the shoulder blades.","Fallout: lean into the straps with arms straight and let them travel forward.","Keep the trunk braced so the hips stay in line."],"dose":"3 x 8 to 15 each.","prog":"Lower body angle; single-arm rows; feet elevated.","reg":"More upright body angle.","street":"Door anchor in a hotel room; tree branch in a park.","g":"S"},{"id":"T-01","name":"Heavy Bag Rounds","equip":"Heavy bag, wraps, gloves","purpose":"Striking power endurance and combat-specific conditioning.","cues":["Hands up, chin down, balanced stance.","Work combinations of 2 to 5 strikes, then move off line.","Exhale sharply with each strike."],"dose":"6 to 12 rounds of 2 to 3 min, 1 min rest.","prog":"Burst intervals: 20 s all-out within each round.","reg":"Shorter rounds at moderate pace.","street":"Shadowboxing with light dumbbells (very light, 1 to 2 kg).","g":"T"},{"id":"T-02","name":"Shadowboxing with Footwork","equip":"None","purpose":"Technique rehearsal, footwork, and aerobic conditioning.","cues":["Visualise an opponent; strike, defend, and move.","Angles: step off the line after each combination.","Stay light on the balls of the feet."],"dose":"3 to 6 rounds of 3 min.","prog":"Add partner calls for defensive reactions.","reg":"Slow technical rounds.","street":"Anywhere with 2 x 2 m of space.","g":"T"},{"id":"T-03","name":"Sprawl to Sprint","equip":"None","purpose":"Takedown defence and explosive return to running.","cues":["Drop the hips to the floor, kick the legs back, chest down.","Snap back to the feet in a fighting stance.","Sprint 10 m immediately."],"dose":"6 to 10 reps, 30 to 45 s rest.","prog":"Reactive start on a call.","reg":"Burpee without the jump, then a 5 m jog.","street":"Grass field or park.","g":"T"},{"id":"T-04","name":"Towel Pull-Up and Hang","equip":"Two towels or ropes, bar","purpose":"Crushing grip and forearm endurance for climbing and grappling.","cues":["Loop towels over the bar and grip one in each hand.","Pull or hang with a neutral grip and packed shoulders.","Squeeze until the forearms burn."],"dose":"Hangs: 4 x 20 to 45 s. Pull-ups: 3 to 4 x 3 to 6.","prog":"Single towel; add weight.","reg":"Bar hang with a standard grip.","street":"Any bar plus a jacket or towel.","g":"T"},{"id":"T-05","name":"Turkish Get-Up","equip":"Kettlebell 12 to 32 kg","purpose":"Ground-to-standing transition, shoulder stability, and control.","cues":["Eyes on the bell, arm locked vertical throughout.","Roll to elbow, hand, bridge, sweep the leg, kneel, stand.","Reverse each step under control."],"dose":"3 to 5 reps per side, slow.","prog":"Heavier bell; get-up with a pause at each position.","reg":"Half get-up to hand position; shoe balanced on the fist.","street":"Water bottle or shoe balanced on the fist.","g":"T"},{"id":"T-06","name":"Casualty Drag","equip":"Sled, heavy bag, or partner (60 to 90 kg)","purpose":"Rescue-specific pulling strength and lifeguard-style casualty movement.","cues":["Grip the harness, collar, or drag strap behind the 'casualty'.","Low hips, short powerful backward steps.","Keep the back flat; drive with the legs."],"dose":"4 to 6 x 20 to 30 m.","prog":"Heavier load; uphill drags.","reg":"Lighter sled or bag.","street":"Drag a partner on a tarp across grass (both consent, both briefed).","g":"T"},{"id":"T-07","name":"Sandbag Over-Shoulder","equip":"Sandbag 30 to 70 kg","purpose":"Lifting an awkward object from the ground to height; total-body grit.","cues":["Bear-hug the bag between the feet, flat back.","Lap it, then explode the hips and roll it over one shoulder.","Alternate shoulders each rep."],"dose":"5 x 5 reps, or 20 reps for time.","prog":"Heavier bag; higher volume EMOM.","reg":"Sandbag to lap only.","street":"Heavy duffel bag.","g":"T"},{"id":"T-08","name":"Cognitive Load Circuit","equip":"Partner or recorded prompts","purpose":"Decision-making and recall under physical stress.","cues":["Before the circuit, memorise a short list (number plate, five words, a route).","Complete 3 to 5 rounds of a hard circuit.","Recall the list on completion; partner may call sums or directions mid-set."],"dose":"1 circuit of 8 to 15 min, once per week.","prog":"Longer lists; changing instructions mid-round.","reg":"Simple recall after one round.","street":"Memorise street names or plates on a run, recall at the end.","g":"T"},{"id":"T-09","name":"Wrist Roller and Wrist Complex","equip":"Wrist roller or barbell with a band and weight; kettlebell; plate","purpose":"Forearm, wrist, and grip endurance for grappling, climbing, and striking.","cues":["Wrist roller: arms forward, roll the weight up and down under control.","Kettlebell wrist flips: from kneeling, flip the bell with the wrist onto the floor and back.","Plate side wrist curls: hold the plate's edge and lift it with the wrist."],"dose":"2 to 3 rounds, 30 to 60 s each, 2 to 3 times per week.","prog":"Heavier load; thicker handles.","reg":"Lighter load; shorter sets.","street":"Stick, cord, and water bottle as a home-made roller.","g":"T"},{"id":"R-01","name":"World's Greatest Stretch","equip":"None","purpose":"Hip flexor, adductor, hamstring, and thoracic mobility in one flow.","cues":["Long lunge, opposite hand down.","Elbow to the inside of the front foot, then rotate the arm to the sky.","Straighten the front leg for a hamstring stretch."],"dose":"5 per side in every warm-up.","prog":"Add a pause and breath in each position.","reg":"Back knee on the ground.","street":"Anywhere.","g":"R"},{"id":"R-02","name":"90/90 Hip Switch","equip":"None","purpose":"Internal and external hip rotation.","cues":["Sit with both knees bent at 90 degrees, one in front, one to the side.","Switch the knees to the other side, hands-free if possible.","Sit tall over the front hip."],"dose":"2 x 8 switches.","prog":"Hands-free; lift the back leg in each position.","reg":"Hands behind for support.","street":"Grass, beach, or floor.","g":"R"},{"id":"R-03","name":"Deep Squat Hold","equip":"Optional support","purpose":"Ankle, hip, and lower-back resilience; restores a basic human position.","cues":["Heels down, knees out, chest up.","Relax and breathe into the position.","Shift gently side to side."],"dose":"Accumulate 3 to 5 min per day.","prog":"Hands overhead; goblet weight.","reg":"Hold a post or heels on a small plate.","street":"Waiting at a bus stop or a crossing.","g":"R"},{"id":"R-04","name":"Copenhagen Plank","equip":"Bench","purpose":"Adductor strength; protects the groin during sprinting and cutting.","cues":["Side plank with the top leg on the bench, bottom leg free.","Body in a straight line, hips high.","Squeeze the top leg into the bench."],"dose":"3 x 15 to 30 s per side.","prog":"Lift the bottom leg; add reps of hip raises.","reg":"Short lever with the knee on the bench.","street":"Park bench.","g":"R"},{"id":"R-05","name":"Calf and Tibialis Complex","equip":"Step, wall","purpose":"Achilles, calf, and shin durability for running, rucking, and jumping.","cues":["Single-leg calf raise with a slow 3 s lowering.","Bent-knee calf raise for the soleus.","Tibialis raise: back against a wall, lift the toes."],"dose":"2 to 3 x 12 to 20 each, 3 times per week.","prog":"Hold a dumbbell; longer pauses.","reg":"Double-leg raises.","street":"Kerb or step.","g":"R"},{"id":"R-06","name":"Dead Hang and Scapular Pull-Up","equip":"Bar","purpose":"Shoulder decompression, grip, and scapular control.","cues":["Passive hang: let the shoulders lift to the ears and breathe.","Active: pull the shoulder blades down without bending the elbows.","Alternate 5 s passive, 5 s active."],"dose":"3 x 30 to 60 s.","prog":"Single-arm hangs.","reg":"Feet supported on a box.","street":"Park bar.","g":"R"},{"id":"R-07","name":"Band Pull-Apart and Face Pull","equip":"Resistance band","purpose":"Upper-back and rotator-cuff balance against heavy pressing.","cues":["Arms straight, pull the band apart to the chest.","Face pull: pull to the forehead, thumbs back, elbows high.","Squeeze the shoulder blades, control the return."],"dose":"2 to 3 x 15 to 25 each, most days.","prog":"Thicker band; pause at end range.","reg":"Lighter band.","street":"Band anchored to a post or fence.","g":"R"},{"id":"R-08","name":"Box Breathing","equip":"None","purpose":"Down-regulation of the nervous system; focus under stress.","cues":["Inhale through the nose for 4 s.","Hold 4 s; exhale 4 s; hold 4 s.","Shoulders relaxed, belly expands."],"dose":"3 to 5 min after sessions or before demanding tasks.","prog":"Extend to 5 or 6 s per side.","reg":"Simple 4 s in, 6 s out.","street":"Anywhere, any time.","g":"R"},{"id":"R-09","
