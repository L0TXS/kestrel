name":"Curl-Up (Spine-Sparing)","equip":"None","purpose":"Anterior trunk endurance without repeated spinal flexion under load.","cues":["Lie on your back, one knee bent, hands under the lower back to keep its natural curve.","Brace, then lift the head and shoulders a few centimetres as one unit; chin stays tucked.","Hold 8 to 10 s, lower, and breathe."],"dose":"Descending pyramid: 6, 4, then 2 holds of 10 s.","prog":"Elbows lifted off the floor; deep breaths during the hold.","reg":"Head only, shorter holds.","street":"Any flat ground.","g":"R"},{"id":"R-10","name":"Side Bridge","equip":"None","purpose":"Lateral trunk stability; protects the spine during carries, swims, and strikes.","cues":["Forearm under the shoulder, body straight from head to feet.","Hips high, ribs stacked, glutes squeezed.","Hold, then roll to the other side without letting the hips sag."],"dose":"Descending pyramid: 6, 4, then 2 holds of 10 s per side.","prog":"Roll from side to side through a front plank; top leg raised.","reg":"From the knees.","street":"Any flat ground.","g":"R"},{"id":"R-11","name":"Bird Dog","equip":"None","purpose":"Spinal control with the hips and shoulders moving: the base of every crawl, stroke, and strike.","cues":["On hands and knees, brace without changing the back's shape.","Reach the opposite arm and leg long and level with the back.","Make a fist and squeeze for 8 to 10 s; sweep back in without touching down."],"dose":"Descending pyramid: 6, 4, then 2 reps per side.","prog":"Draw squares with the hand and foot while holding.","reg":"Arm or leg only.","street":"Grass or a towel.","g":"R"},{"id":"R-12","name":"Hip and Shoulder CARs","equip":"None","purpose":"Controlled articular rotations: maintains and audits end-range control of the joints.","cues":["Brace everything except the joint being moved.","Draw the largest pain-free circle the joint allows, slowly.","Hip: on all fours or standing. Shoulder: standing, fist clenched."],"dose":"3 slow circles each direction, each joint, daily.","prog":"Add tension (irradiation) through the whole body.","reg":"Smaller circles.","street":"Anywhere.","g":"R"},{"id":"R-13","name":"Spanish Squat Isometric","equip":"Heavy band or strap anchored behind the knees","purpose":"Patellar and quadriceps tendon conditioning; reduces knee pain under jumping and running loads.","cues":["Strap behind the knees, lean back into it.","Sit back with vertical shins to about a 60 to 90 degree knee angle.","Hold with strong quadriceps contraction."],"dose":"5 x 45 s holds, 2 min rest.","prog":"Hold a dumbbell at the chest; deeper angle.","reg":"Wall sit at a shallow angle.","street":"Strap or towel around a post.","g":"R"},{"id":"R-14","name":"Open Book Thoracic Rotation","equip":"None","purpose":"Thoracic rotation for swimming, striking, and posture; useful for stiff mid-backs.","cues":["Side-lying, knees bent to 90 degrees, arms together in front.","Open the top arm across to the other side, following it with the eyes.","Breathe out at the end range; keep the knees stacked so the rotation comes from the mid-back."],"dose":"2 x 8 per side.","prog":"Pause 3 breaths at end range; add a light dumbbell.","reg":"Smaller range.","street":"Grass, sand, or a towel.","g":"R"},{"id":"R-15","name":"Neck Isometrics","equip":"Hand or band","purpose":"Neck strength for impact tolerance, grappling, and heavy surf.","cues":["Neutral head position, brace the neck.","Press the head into the hand: forwards, backwards, and each side.","Build to firm, submaximal pressure, smooth on and off."],"dose":"2 x 10 s each direction, 3 times per week.","prog":"Band resistance with slow controlled movement.","reg":"Lighter pressure.","street":"Anywhere.","g":"R"},{"id":"R-16","name":"Foot and Wrist Conditioning","equip":"Towel, light plate or band","purpose":"Arches, toes, wrists, and fingers: the small joints that take every landing, push-up, and punch.","cues":["Short foot: shorten the arch without curling the toes, hold 5 s.","Towel scrunches and toe spreads.","Wrist circles, loaded wrist rocks on all fours, and finger extensions against a band."],"dose":"5 min, 3 to 5 times per week.","prog":"Barefoot balance work; knuckle push-up holds on a soft surface.","reg":"Seated versions.","street":"Barefoot on grass or sand.","g":"R"},{"id":"R-17","name":"Hollow and Arch Holds","equip":"None","purpose":"The gymnast's trunk foundation: full-body tension front and back, without repeated spinal flexion.","cues":["Hollow: lower back pressed down, arms and legs long and off the floor.","Arch: face down, lift the arms, chest, and legs with the glutes tight.","Rock gently in each shape once the holds are solid."],"dose":"3 rounds of 20 to 30 s hollow and 20 to 30 s arch.","prog":"Hollow rocks and arch rocks; roll between the two shapes.","reg":"Knees bent, arms by the sides.","street":"Grass, sand, or a towel.","g":"R"},{"id":"R-18","name":"Cossack Squat","equip":"None; optional counterweight","purpose":"Adductor flexibility, lateral hip strength, and ankle mobility.","cues":["Wide stance; shift into one hip and sit down over that foot.","Keep the other leg straight with the toes pointed up.","Stay tall and move side to side under control."],"dose":"2 to 3 x 5 per side.","prog":"Counterweight held forward; deeper range.","reg":"Hold a post; partial range.","street":"Anywhere.","g":"R"},{"id":"R-19","name":"Single-Leg Hip Flexor Sit-Up","equip":"Box or bench 40 cm","purpose":"Strengthens the hip flexors through a long range on one side at a time, and opens the front of the hip and trunk.","cues":["Sit on the box with one knee hooked over it and the other leg extended behind and below.","Lower back under control towards the floor, then sit up by pulling with the hooked hip.","Move smoothly; stop short of the end range if the lower back complains."],"dose":"2 to 3 x 5 to 8 per side.","prog":"Hold a light plate at the chest.","reg":"Standing psoas march; seated knee raises with a band.","street":"Park bench.","g":"R"},{"id":"R-20","name":"Foot-to-Hip Longevity Flow","equip":"Optional kettlebell","purpose":"Toe, ankle, knee, and hip capacity in deep positions: the base the rest of the body stands on.","cues":["60 s toe sit (kneel on tucked toes), 60 s deep squat with one arm reaching overhead.","60 s overhead curtsy lunge into a deep side squat, then 60 s tiptoe squat hold with knees out.","Finish with 60 s of single-leg RDL passes, moving a kettlebell between hands."],"dose":"One round, 3 to 5 times per week.","prog":"Add load to the squat and RDL; longer holds.","reg":"Hands on support; shorter holds.","street":"Barefoot on grass or carpet.","g":"R"},{"id":"R-21","name":"Plate Shoulder Circuit","equip":"Weight plate 5 to 15 kg","purpose":"Shoulder health and endurance through every direction: the wrestler's finisher.","cues":["Halos: circle the plate around the head, close to the skull, both directions.","Steering wheel: arms straight in front, turn the plate side to side.","Finish with a front hold at shoulder height, then lower slowly."],"dose":"2 to 3 rounds of 30 s each movement.","prog":"Heavier plate; longer rounds.","reg":"Lighter plate or a book.","street":"Water jug or sandbag.","g":"R"},{"id":"R-22","name":"Hanging Traction","equip":"Bar","purpose":"Spinal and shoulder decompression with gentle movement of the hips.","cues":["Hang relaxed from a bar.","Slowly swing the legs forward and back, then side to side, without bouncing.","Add slow, small turns of the hips with the feet together."],"dose":"2 to 3 x 30 to 45 s.","prog":"Longer hangs; single-arm hangs.","reg":"Feet supported on a box.","street":"Park bar or playground frame.","g":"R"},{"id":"R-23","name":"Morning Joint Mobility Sequence","equip":"None","purpose":"Daily circles and rotations of every joint, working from the extremities to the centre.","cues":["Fingers, wrists, elbows, shoulders, neck, then hips, knees, ankles, and toes.","Controlled movement only; never bounce, especially through the spine.","Breathe calmly and keep each joint moving within a pain-free range."],"dose":"Start with 10 reps per movement and add 10 per week, up to about 30.","prog":"Larger, slower ranges.","reg":"Fewer reps.","street":"Anywhere, first thing in the morning.","g":"R"},{"id":"V-01","name":"Quadrupedal Crawl","equip":"None","purpose":"Shoulder stability, contralateral coordination, and trunk control.","cues":["Bear crawl: knees hover 5 cm off the ground, back flat.","Move opposite hand and foot together.","Quiet hands and feet; keep the hips level."],"dose":"4 x 20 m forwards, backwards, and sideways.","prog":"Lizard crawl (low, elbows bent); uphill crawl.","reg":"Shorter distances, slower pace.","street":"Grass, sand, or a footpath with gloves.","g":"V"},{"id":"V-02","name":"Wall Climb-Up","equip":"Wall 1.5 to 2.2 m","purpose":"Getting the body over an obstacle using pull, push, and leg drive.","cues":["Step into the wall, foot high, and drive up.","Grab the top, pull the chest over, elbows on top.","Press to straight arms and swing a leg over."],"dose":"5 to 8 climbs, technique quality first.","prog":"Higher wall; one-step approach; no-feet climb-up.","reg":"Lower wall; box step-assist.","street":"Purpose-built parkour parks or sturdy low walls on public land.","g":"V"},{"id":"V-03","name":"Safety and Speed Vault","equip":"Rail, bench, or box 70 to 100 cm","purpose":"Fast, controlled passage over waist-height obstacles.","cues":["Safety vault: hand and foot on the obstacle, other leg passes through.","Speed vault: one hand, legs swing over to the side.","Land on the balls of the feet and keep moving."],"dose":"3 x 5 each side.","prog":"Run-in approach; lazy vault and kong vault.","reg":"Step-over with both hands.","street":"Park benches and low railings (check stability first).","g":"V"},{"id":"V-04","name":"Precision Jump","equip":"Lines, kerbs, low walls","purpose":"Accuracy and control in landing on small targets.","cues":["Feet together, swing the arms, jump to the exact spot.","Land on the balls of the feet, heels hovering.","Stick silently for three seconds."],"dose":"4 x 5 jumps.","prog":"Narrower targets; greater distance; raised targets.","reg":"Line-to-line jumps on flat ground.","street":"Kerb to kerb, line to line, at ground level.","g":"V"},{"id":"V-05","name":"Rail and Kerb Balance Walk","equip":"Kerb, beam, or rail","purpose":"Proprioception and ankle stability.","cues":["Eyes forward on a fixed point ahead.","Soft knees, arms out for balance.","Walk heel-to-toe, forwards and backwards."],"dose":"3 to 5 x 10 to 20 m.","prog":"Narrow rail; eyes closed (on a kerb only).","reg":"Painted line on the ground.","street":"Kerbs and low beams.","g":"V"},{"id":"V-06","name":"Shoulder Roll","equip":"Grass, mats, or sand","purpose":"Falling safely and turning momentum into movement.","cues":["Reach diagonally, tuck the head to the opposite side.","Roll from the back of the shoulder across to the opposite hip.","Come up to the feet facing forward."],"dose":"10 to 20 rolls per side, gradually progressed.","prog":"From standing; from a walk; from a jog.","reg":"From kneeling.","street":"Learn on grass or mats first; progress to hard ground only when flawless.","g":"V"},{"id":"V-07","name":"Military Low Crawl","equip":"None","purpose":"Moving low and unseen; brutal trunk and shoulder endurance.","cues":["Body flat, head down, cheek near the ground.","Pull with the forearms and push with one leg drawn up the side.","Keep the hips glued down."],"dose":"4 to 6 x 10 to 20 m.","prog":"Pulling a sandbag or wearing a light pack.","reg":"High crawl on forearms and knees.","street":"Grass field or beach.","g":"V"},{"id":"V-08","name":"Clothed Swim and Tread","equip":"Supervised pool, old clothes","purpose":"Water escape competence when not dressed for swimming.","cues":["Enter feet first; remove shoes if needed in the water.","Breaststroke or sidestroke to save energy.","Tread with an eggbeater kick and sculling hands."],"dose":"100 to 200 m clothed swim, then 5 to 10 min tread.","prog":"Hands-up tread; brick or weight retrieval.","reg":"Swimwear first; then add a shirt and trousers.","street":"Only in supervised pools or with qualified lifeguard cover.","g":"V"},{"id":"L-01","name":"Ruck March","equip":"Pack 10 to 25 kg, broken-in boots or trail shoes","purpose":"Load-carriage endurance; the foundation of field fitness.","cues":["Load sits high and tight against the back.","Short, quick steps; no running with a load early on.","Target pace 9 to 11 min per km on flat ground."],"dose":"4 to 15 km, once per week.","prog":"Increase only one of distance or load per week, by no more than 10 percent.","reg":"Unloaded brisk hike.","street":"Urban routes with hills and stairs; carry water and a phone.","g":"L"},{"id":"L-02","name":"Farmer's Carry","equip":"Kettlebells, dumbbells, or trap bar","purpose":"Grip, trapezius, trunk, and gait under heavy load.","cues":["Pick up with a hinge, stand tall, shoulders packed.","Short controlled steps; do not let the weights swing.","Breathe behind a brace."],"dose":"4 to 6 x 30 to 50 m.","prog":"Build to bodyweight total (half per hand).","reg":"Lighter load, shorter distance.","street":"Two shopping bags full of water bottles.","g":"L"},{"id":"L-03","name":"Suitcase Carry","equip":"One kettlebell or dumbbell","purpose":"Anti-lateral flexion; obliques and quadratus lumborum.","cues":["Weight in one hand, stand perfectly upright.","Do not lean away or towards the load.","Switch hands each set."],"dose":"3 to 4 x 30 m per side.","prog":"Heavier load; walk on uneven ground.","reg":"Lighter load.","street":"One loaded bag.","g":"L"},{"id":"L-04","name":"Sandbag Bear-Hug Carry","equip":"Sandbag 30 to 60 kg","purpose":"Carrying an awkward load or person close to the body.","cues":["Hug the bag high on the chest.","Squeeze the elbows in and lean back slightly.","Breathe shallow and steady behind the brace."],"dose":"4 x 30 to 50 m.","prog":"Heavier bag; uphill.","reg":"Lighter bag; shorter distance.","street":"Heavy duffel or a sack of sand from a garden centre.","g":"L"},{"id":"L-05","name":"Ruck Step-Up","equip":"Pack, box or bench 40 to 50 cm","purpose":"Hill-climbing strength under load.","cues":["Whole foot on the box; drive through the heel.","Stand tall at the top; do not push off the back foot.","Step down under control."],"dose":"3 x 10 to 15 per leg, or 10 to 20 min continuous.","prog":"Heavier pack; higher box.","reg":"Bodyweight step-ups.","street":"Park benches or stairs.","g":"L"},{"id":"L-06","name":"Overhead Carry","equip":"Kettlebell or dumbbell","purpose":"Shoulder stability and trunk control with the load overhead.","cues":["Lock the arm overhead, biceps by the ear.","Ribs down, glutes squeezed.","Walk slowly and stay tall."],"dose":"3 x 20 to 30 m per side.","prog":"Bottoms-up kettlebell hold; two-arm carry.","reg":"Rack carry at the shoulder.","street":"A water jug held overhead.","g":"L"},{"id":"L-07","name":"Sled Push","equip":"Sled or prowler","purpose":"Leg drive and power endurance without eccentric soreness.","cues":["Arms straight or bent, body angled at 45 degrees.","Drive the knees and push through the balls of the feet.","Short powerful steps."],"dose":"6 to 10 x 15 to 25 m.","prog":"Heavier sled; push-pull combinations.","reg":"Lighter sled.","street":"Push a car in neutral on flat ground with a driver at the wheel and a spotter.","g":"L"},{"id":"L-08","name":"Zercher Carry","equip":"Barbell or sandbag","purpose":"Front-loaded trunk strength and upper-back endurance.","cues":["Cradle the load in the crooks of the elbows.","Stand tall, hands clasped, upper back tight.","Walk with short controlled steps."],"dose":"3 to 4 x 20 to 40 m.","prog":"Heavier load; longer distance.","reg":"Goblet carry with a kettlebell.","street":"Sandbag or rolled-up heavy mat.","g":"L"},{"id":"L-09","name":"Offset Carry","equip":"One kettlebell and one dumbbell of different weights","purpose":"Uneven loading that forces the trunk to resist both bending and rotation, like real loads.","cues":["Hold a heavier weight in one hand and a lighter one in the other, or one racked and one at the side.","Walk tall without leaning or twisting.","Swap sides each set."],"dose":"3 to 4 x 30 m per side.","prog":"Bigger weight difference; uneven ground.","reg":"Lighter loads.","street":"One full and one half-full bag.","g":"L"},{"id":"C-01","name":"Jump Rope","equip":"Skipping rope","purpose":"Footwork, rhythm, calf stiffness, and coordination.","cues":["Turn the rope from the wrists, elbows close.","Bounce on the balls of the feet a few centimetres off the ground.","Mix basic bounce, boxer skip, alternate feet, and high knees."],"dose":"3 to 5 rounds of 3 min, 1 min rest.","prog":"Double-unders; crossovers; 30 s speed bursts.","reg":"Shorter rounds; rope-free footwork.","street":"Any flat surface.","g":"C"},{"id":"C-02","name":"Target Strike Drill","equip":"Focus mitts and partner, or a hanging ball, tape marks on a bag","purpose":"Accuracy, distance management, and speed of the hands.","cues":["Strike only the called or marked target.","Snap the strike back to guard as fast as it went out.","Reset stance after every combination."],"dose":"4 to 6 rounds of 2 min.","prog":"Moving targets; random calls; strikes in under 0.5 s from call.","reg":"Static targets, single strikes.","street":"Tennis ball on a string hung from a branch or bar.","g":"C"},{"id":"C-03","name":"Roundhouse Kick","equip":"Heavy bag or kick shield","purpose":"Rotational kicking power and hip mobility.","cues":["Step out at an angle and pivot on the supporting foot.","Turn the hip over and strike with the shin.","Return to stance along the same line."],"dose":"5 rounds of 2 min, alternating sides.","prog":"Switch kicks; kick-punch combinations.","reg":"Slow technical kicks to the low or mid line.","street":"Shadow kicks; post padded with a folded jacket (low power only).","g":"C"},{"id":"C-04","name":"Push Kick (Teep)","equip":"Heavy bag or kick shield","purpose":"Distance creation and straight-line kicking power.","cues":["Lift the knee to the chest.","Drive the ball of the foot or heel through the target from the hip.","Recoil and land balanced."],"dose":"4 x 10 per leg.","prog":"Lead-leg skip teep; moving partner holding a shield.","reg":"Knee lift and extend in the air.","street":"Shadow drill.","g":"C"},{"id":"C-05","name":"Hip Escape (Shrimp)","equip":"Mat or grass","purpose":"Creating space from the ground; a fundamental grappling movement.","cues":["On your back, plant one foot and turn onto your side.","Drive the hips back away from your hands.","Return to the back and repeat on the other side as you travel."],"dose":"4 x 15 m.","prog":"Shrimp to technical stand-up; resisted by a partner or band.","reg":"Static shrimps on the spot.","street":"Grass or sand.","g":"C"},{"id":"C-06","name":"Bridge and Roll","equip":"Mat or grass","purpose":"Explosive hip extension from the back; escaping a pinned position.","cues":["On your back, feet close to the hips.","Bridge up and over one shoulder, looking behind it.","Roll to the knees and come up to base."],"dose":"3 x 6 per side.","prog":"With a partner or heavy bag on top.","reg":"Glute bridge with a turn.","street":"Grass or sand.","g":"C"},{"id":"C-07","name":"Technical Stand-Up","equip":"None","purpose":"Getting up from the ground while protected and balanced.","cues":["Seated, post one hand behind and the opposite foot in front.","Lift the hips and swing the free leg back through.","Land in a fighting stance with the hands up."],"dose":"3 x 6 per side.","prog":"From a shrimp or a roll; on a call.","reg":"Slow and deliberate.","street":"Anywhere.","g":"C"},{"id":"C-08","name":"Landmine Rotational Punch","equip":"Barbell in a landmine or corner","purpose":"Transferring force from the ground through the hips into a straight strike.","cues":["Hold the end of the bar at the rear shoulder in a staggered stance.","Pivot the back foot and rotate the hips.","Punch the bar up and out; control the return."],"dose":"4 x 6 per side.","prog":"Heavier load; faster tempo.","reg":"Band punch from a post.","street":"Band anchored to a post or fence.","g":"C"},{"id":"C-09","name":"Clinch Grip and Pummel","equip":"Partner, or heavy bag","purpose":"Upper-body endurance and control in close range.","cues":["Clasp hands behind the partner's head or the top of the bag.","Swim the arms inside in turn (pummel) with posture tall.","Pull the target down while staying upright."],"dose":"4 to 6 rounds of 1 min.","prog":"Add knees to the bag; resisting partner.","reg":"Static bag clinch holds.","street":"Partner drill on grass.","g":"C"},{"id":"C-10","name":"Reaction Ball Drill","equip":"Reaction ball or tennis ball, wall","purpose":"Hand-eye coordination, reaction time, and visual tracking.","cues":["Throw the ball against a wall and catch it before the second bounce.","Alternate hands; stay low and alert.","Track the ball with the eyes and keep the head still."],"dose":"3 x 1 min.","prog":"Reaction ball (irregular bounce); a partner throws unannounced.","reg":"Two-handed catches.","street":"Tennis ball and any wall.","g":"C"},{"id":"C-11","name":"Scramble Reshot Drill","equip":"Mats","purpose":"Recovering position after a fall or spin and exploding into a level change from wherever you land.","cues":["Spin, sprawl, or fall to the mat from a standing start.","On landing, immediately drop the hips and drive forward off either leg into a shot.","Return to stance and repeat in a different direction."],"dose":"4 to 6 sets of 4 to 6 reps.","prog":"Partner calls the direction; land from rolls.","reg":"From kneeling: drive forward off one foot.","street":"Grass, with soft-surface rolls only.","g":"C"},{"id":"C-12","name":"Knee Chamber and Kick Flexibility","equip":"Wall or post for balance","purpose":"Active flexibility and control for high, fast kicks.","cues":["Stand beside a wall, lift the knee to the chest in a tight chamber.","Extend the kick slowly to its highest controlled point, then return to the chamber.","Lower with control; repeat to the front, side, and back."],"dose":"2 x 5 per direction per leg.","prog":"Hold the extended kick for 3 to 5 s; no wall support.","reg":"Lower targets.","street":"Anywhere with a fence or post.","g":"C"},{"id":"W-01","name":"Freestyle Technique Drills","equip":"Pool","purpose":"Efficient freestyle: long body line, early catch, and relaxed breathing.","cues":["Catch-up: one hand waits in front until the other arrives.","Fingertip drag: high elbow, fingertips trail the surface on recovery.","6-1-6: six kicks on the side, one stroke, six kicks on the other side."],"dose":"8 to 12 x 25 m of drills inside each swim warm-up.","prog":"Drill-swim combinations (25 drill, 25 swim).","reg":"Fins for support.","street":"Dryland: band pulls in the freestyle path.","g":"W"},{"id":"W-02","name":"Bilateral Breathing Sets","equip":"Pool or open water","purpose":"Symmetrical stroke and comfort breathing on both sides, essential in open water and chop.","cues":["Breathe every 3 strokes, alternating sides.","Rotate the head with the body, one goggle in the water.","Exhale steadily underwater; inhale quickly."],"dose":"6 x 100 m at easy to moderate pace.","prog":"Every 5 strokes on alternate lengths (within safe limits).","reg":"Every 2 strokes, alternating sides each length.","street":"Patrolled beach swim parallel to shore.","g":"W"},{"id":"W-03","name":"Threshold Swim Sets (CSS)","equip":"Pool, pace clock","purpose":"Raises sustainable swim speed using critical swim speed (CSS) pace.","cues":["Find CSS pace from the 400 m and 200 m test (Section 6.3).","Swim each repeat at CSS pace with even splits.","Short rest of 10 to 20 s."],"dose":"8 to 12 x 100 m at CSS, 15 s rest.","prog":"10 x 200 m at CSS; reduce rest.","reg":"6 x 100 m with 30 s rest.","street":"Open water: timed efforts between buoys or landmarks.","g":"W"},{"id":"W-04","name":"Sprint Swim","equip":"Pool","purpose":"Maximal swim speed and anaerobic power for rescues and escapes.","cues":["Explosive push-off, fast high-tempo stroke.","Breathe less frequently, within safe limits.","Full recovery between sprints."],"dose":"8 to 12 x 25 m all-out, 45 to 60 s rest.","prog":"50 m sprints; sprint from a treading start.","reg":"6 x 15 m.","street":"Sprint to a marker from a standing start in waist-deep water.","g":"W"},{"id":"W-05","name":"Kick Sets","equip":"Kickboard, optional fins","purpose":"Leg endurance and propulsion for freestyle, surf entries, and towing.","cues":["Kick from the hips with relaxed ankles.","Small, fast kicks; minimal knee bend.","Alternate board kick, side kick, and streamline kick."],"dose":"6 to 10 x 50 m, 15 s rest.","prog":"Fins for speed sets; vertical kicking with hands up.","reg":"25 m repeats.","street":"Fin kicking along the shore line in safe water.","g":"W"},{"id":"W-06","name":"Pull Sets","equip":"Pull buoy, optional paddles","purpose":"Upper-body swim strength and catch mechanics.","cues":["Buoy between the thighs, light flutter or none.","High elbow catch, pull back to the hip.","Paddles only once the stroke is technically sound."],"dose":"4 to 8 x 100 m, 15 to 20 s rest.","prog":"Paddles; band around the ankles.","reg":"Shorter repeats.","street":"Dryland: band freestyle pulls 3 x 1 min.","g":"W"},{"id":"W-07","name":"Eggbeater and Sculling","equip":"Deep water","purpose":"Staying high and stable in the water with the hands free.","cues":["Eggbeater: alternating circular kicks, knees wide, upright trunk.","Scull: figure-eight hand movements at chest height.","Keep the chin above the water, breathing calm."],"dose":"4 x 1 to 2 min, building to hands out of the water.","prog":"Hands above the head; hold a weight above the water.","reg":"Hold the pool edge with one hand.","street":"Supervised deep water only.","g":"W"},{"id":"W-08","name":"Survival Strokes","equip":"Pool or open water","purpose":"Energy-efficient strokes for long durations, rough water, or towing.","cues":["Breaststroke: glide after each kick, head up when sighting.","Sidestroke: scissor kick, one arm leading; keeps the face clear of chop.","Survival backstroke: frog kick, arms sweep to the sides."],"dose":"4 x 100 m, one stroke per repeat.","prog":"In clothing (see V-08); towing a buoy or partner.","reg":"25 m of each.","street":"Patrolled beach within the flags.","g":"W"},{"id":"W-09","name":"Dolphin Dive and Duck Dive","equip":"Waist-deep surf or the shallow end of a pool","purpose":"Getting under breaking waves quickly and safely.","cues":["Dolphin dive: dive forward under the wave, hands to the sand, push off and spring up.","Duck dive: in deeper water, dive down under the turbulence and kick through.","Surface, breathe, and look seaward for the next wave."],"dose":"3 to 5 sets of 5 to 8 dives through the break.","prog":"Larger surf (with patrol and experience only); timed sets.","reg":"Practise in a pool's shallow end before small surf.","street":"Patrolled beaches only.","g":"W"},{"id":"W-10","name":"Surf Entry, Exit, and Body Surfing","equip":"Patrolled beach","purpose":"Reading the surf, entering and exiting efficiently, and using waves.","cues":["Read the beach: identify rips, banks, and sets before entering.","High-step through shallow water, dolphin dive when waist-deep.","Catch a wave in by kicking hard and holding a streamlined body position."],"dose":"20 to 40 min of practice, 1 to 2 times per month.","prog":"Surf swims around a fixed point and back; body surf from further out.","reg":"Small, clean surf; stay within standing depth.","street":"Patrolled beaches only; never alone.","g":"W"},{"id":"W-11","name":"Soft-Sand Sprint and Run","equip":"Beach","purpose":"Leg power, ankle robustness, and beach-specific conditioning.","cues":["Short, quick steps, drive the knees.","Upright posture; arms drive hard.","Walk back for recovery on sprints."],"dose":"6 to 10 x 30 to 60 m sprints, or a 15 to 25 min soft-sand run.","prog":"Uphill dunes; beach flags style reaction start (lying face down).","reg":"Hard-sand running near the water line.","street":"Any beach.","g":"W"},{"id":"W-12","name":"Run-Swim-Run","equip":"Patrolled beach or pool and track","purpose":"Transitioning between land and water under fatigue.","cues":["Run hard, enter the water at a controlled pace.","Settle the breathing in the first 50 m of swimming.","Exit and run with quick, short steps until the legs return."],"dose":"1 to 3 rounds of 400 to 1,000 m run, 200 to 400 m swim, 400 to 1,000 m run.","prog":"Add the clothed swim; timed against previous efforts.","reg":"Short distances with walking transitions.","street":"Patrolled beaches.","g":"W"},{"id":"W-13","name":"Casualty Tow","equip":"Partner, rescue tube or buoy, supervision","purpose":"Moving another person through the water: the decisive water skill.","cues":["Approach with the tube or buoy between you and the casualty.","Tow on your side using sidestroke or eggbeater kick.","Keep the casualty's face clear of the water at all times."],"dose":"4 x 25 to 50 m.","prog":"Tow without equipment (qualified training only); longer distances.","reg":"Tow a kickboard or buoy only.","street":"Club or pool training with qualified instructors.","g":"W"},{"id":"W-14","name":"Supervised Underwater Swim","equip":"Pool with a dedicated spotter on the edge","purpose":"Calm underwater movement and controlled breath-holding.","cues":["Take two or three normal breaths: never hyperventilate.","Breaststroke pull and glide underwater at a relaxed pace.","Surface early at the first strong urge to breathe."],"dose":"4 to 6 x 10 to 15 m, 1 to 2 min rest at the surface.","prog":"Up to 25 m only with a trained spotter watching each attempt.","reg":"Push-and-glide only.","street":"Never in open water; never without a spotter.","g":"W"},{"id":"W-15","name":"Combat Sidestroke","equip":"Pool or open water","purpose":"A low-profile, efficient long-distance stroke that keeps the face low and the eyes forward.","cues":["Swim on the side with a long glide after every stroke.","Strong scissor kick with a big extension of both arms.","Breathe with the face turned slightly, keeping the head low."],"dose":"4 to 8 x 100 m.","prog":"Swim with fins; longer repeats.","reg":"25 m repeats with full rest.","street":"Patrolled beach parallel to the shore.","g":"W"},{"id":"W-16","name":"Fin Swim","equip":"Long or short swim fins","purpose":"Leg endurance and propulsion for long swims, surf work, and towing.","cues":["Kick from the hips with long, smooth strokes.","Keep the knees relaxed and the ankles loose.","Start short to let the ankles and calves adapt."],"dose":"500 to 2,000 m, steady.","prog":"Timed 1,000 m fin swim.","reg":"200 to 400 m blocks.","street":"Calm patrolled beaches or open-water swim courses.","g":"W"},{"id":"M-01","name":"Observation and Recall","equip":"Partner, or a tray of objects or a street scene","purpose":"Situational awareness and short-term memory under time pressure.","cues":["Study a set of objects, a room, or a street scene for 30 to 60 s.","Look away and list everything you can recall: items, colours, positions, people.","Check the answer and record the score."],"dose":"2 to 3 rounds, 3 times per week.","prog":"Shorter viewing time; recall after a hard effort.","reg":"Fewer objects.","street":"Recall number plates, shop names, and faces on a run.","g":"M"},{"id":"M-02","name":"Route Memory and Navigation","equip":"Map, compass","purpose":"Navigating without a phone and remembering routes on the move.","cues":["Study a route on a map, then run or ruck it without looking again.","Note landmarks at each turn.","Afterwards, sketch the route from memory and compare."],"dose":"Once per week on a run or ruck.","prog":"New areas; night navigation in safe locations.","reg":"Familiar routes with fewer turns.","street":"Any town or park.","g":"M"},{"id":"M-03","name":"Dual-Task Running","equip":"None","purpose":"Thinking clearly under physical stress.","cues":["During a steady or interval run, count back from 300 in sevens, or solve sums a partner calls.","Keep the pace on target while you think.","Note errors and pace drift."],"dose":"5 to 10 min inside a run, once per week.","prog":"Harder tasks at higher intensities.","reg":"Simple counting at an easy pace.","street":"Any run.","g":"M"},{"id":"M-04","name":"Visualisation Rehearsal","equip":"Quiet space","purpose":"Mental rehearsal of skills and scenarios to improve technique and composure.","cues":["Close the eyes and run through a skill or scenario in real time.","Use every sense: sound, feel, smell, and sight.","Rehearse the right response to problems as well as success."],"dose":"5 to 10 min, 3 to 5 times per week.","prog":"Scenario changes and complications.","reg":"Single simple skills.","street":"Anywhere quiet.","g":"M"},{"id":"M-05","name":"Juggling","equip":"Three balls","purpose":"Hand-eye coordination, peripheral vision, and rhythm.","cues":["Start with one ball in an arc from hand to hand at eye height.","Add the second ball, then the third, in a steady rhythm.","Keep the eyes fixed on the top of the arc."],"dose":"5 min, most days.","prog":"Juggle while walking or standing on one leg.","reg":"Two balls.","street":"Anywhere.","g":"M"}],"groups":[{"k":"K","n":"Kinetic","why":"Most decisive moments on the street last under ten seconds: a sprint to cover, a jump across a gap, a shove that creates space. Kinetic work builds the rate of force development that wins those moments."},{"k":"E","n":"Endurance","why":"The aerobic engine pays for everything else. A large base speeds recovery between efforts, between sessions, and between operations, and keeps the mind clear when the heart rate climbs."},{"k":"S","n":"Strength","why":"Strength is the reserve every other quality draws on. A stronger operative moves loads with less effort, resists injury, and has more left in the tank for skill."},{"k":"T","n":"Tactical","why":"Fitness only counts when it transfers to the task. Tactical work trains the body to strike, grapple, drag, and think while the lungs burn."},{"k":"R","n":"Resilience","why":"The best programme is the one you can keep doing. Resilience work keeps joints, tendons, and the nervous system ready for the next session and out of the clinic."},{"k":"V","n":"Evasion","why":"Getting over, under, and through the environment efficiently is a skill. Evasion work turns raw athleticism into movement that is quiet, economical, and safe."},{"k":"L","n":"Load","why":"Operatives carry kit, people, and supplies. Load work hardens the feet, back, hips, and grip, and builds the dull, grinding durability that separates the trained from the merely fit."},{"k":"C","n":"Combat","why":null},{"k":"W","n":"Water","why":null},{"k":"M","n":"Mind","why":null}],"ops":[{"name":"EXFIL","brief":"Loaded movement broken by bodyweight work, finishing with an unloaded sprint.","kit":"Pack 12 to 18 kg","mission":"Ruck 6 km. At each kilometre: 10 ruck squats, 10 push-ups, and 10 ruck swings. After the final kilometre, drop the pack and sprint 400 m.","std":"Under 70 min total; final 400 m under 80 s."},{"name":"DEAD DROP","brief":"Carry medley for grip, trunk, and grit.","kit":"2 kettlebells 24 to 32 kg, sandbag 30 to 50 kg, 1 kettlebell 16 to 24 kg","mission":"5 rounds: 40 m farmer's carry, 40 m sandbag bear-hug carry, 20 m overhead carry per arm, 20 m suitcase carry per side. 90 s rest between rounds.","std":"No drops at the prescribed loads."},{"name":"ROOFTOP","brief":"Urban movement circuit. Named for the theme only: every element stays at ground level.","kit":"Parkour park or public space with walls and rails","mission":"5 rounds: 200 m run, 3 wall climb-ups, 4 vaults (2 per side), 5 precision jumps, 15 m bear crawl, 15 m low crawl.","std":"Under 25 min with clean, quiet technique."},{"name":"RECESS","brief":"Playground and outdoor fitness-area circuit.","kit":"Public playground or outdoor gym (use when free, and give way to children)","mission":"5 rounds: monkey-bar traverse x 3 lengths, 10 bar dips, 10 step-ups per leg onto a platform, 5 pull-ups, 10 m crawl under equipment, balance beam walk forwards and back.","std":"Under 25 min without coming off the bars."},{"name":"SAFE HOUSE","brief":"Quiet, equipment-free session for a hotel room or small flat.","kit":"None; 2 x 2 m of floor","mission":"20 min AMRAP: 10 push-ups, 10 split squats per leg (back foot on the bed edge), 10 curl-ups, 5 quiet burpees (step back and in, no jump), 30 s wall sit.","std":"8 or more rounds."},{"name":"BLACK SITE","brief":"Deck-of-cards session: random, relentless, and mentally demanding.","kit":"A standard deck of cards","mission":"Turn one card at a time. Hearts: push-ups. Diamonds: air squats. Clubs: curl-ups. Spades: burpees. Number cards at face value; jacks, queens, and kings 10; aces 15. Jokers: run 400 m.","std":"Full deck in under 40 min."},{"name":"PURSUIT","brief":"Street fartlek built around whatever the route presents.","kit":"Running shoes","mission":"40 min run. Surge between every third lamppost for the first 10 min. Attack every set of stairs at maximum effort. At each park, 5 sprawl-to-sprints. Recover by jogging; never walk.","std":"No walking for the full 40 min."},{"name":"THE LONG WALK","brief":"Monthly endurance ruck to build durability and patience.","kit":"Pack 12 to 15 kg, 2 to 3 litres of water, food","mission":"15 to 20 km on a hilly route at conversational pace. Stop at halfway for a 5 min foot and kit check.","std":"15 km under 2 h 45 min with no hot spots."},{"name":"TWELVE ROUNDS","brief":"Striking conditioning marathon.","kit":"Heavy bag, gloves, kettlebell","mission":"12 x 3 min rounds, 1 min rest. Odd rounds: heavy bag combinations. Even rounds: 1 min sprawl-to-sprint, 1 min kettlebell swings, 1 min shadowboxing.","std":"Output held through all 12 rounds."},{"name":"CLOSE QUARTERS","brief":"Mixed striking and grappling conditioning.","kit":"Heavy bag, mat or grass","mission":"6 x 3 min rounds, 1 min rest: 1 min heavy bag, 30 s sprawls, 30 s hip escapes, 30 s technical stand-ups, 30 s clinch knees on the bag.","std":"All rounds completed with technique intact."},{"name":"RIPTIDE","brief":"Pool session drawn from surf lifesaving and water-escape standards.","kit":"Supervised pool, old clothes, rescue tube","mission":"400 m warm-up; 8 x 50 m sprint on 75 s; 200 m clothed swim; 4 x 25 m casualty tow; 5 min tread (final minute hands up).","std":"All repeats on the cycle; tread unbroken."},{"name":"TIDAL","brief":"Surf session for beach-ready operatives.","kit":"Patrolled beach, swimwear or wetsuit, buddy","mission":"10 min soft-sand warm-up. 4 rounds: 100 m soft-sand sprint, wade and dolphin dive out, 100 m swim parallel to the beach, body surf or swim in. Finish with 5 beach-flag reaction sprints of 20 m.","std":"Smooth transitions, controlled breathing, always within the flags."},{"name":"LAST LIGHT","brief":"Evening hill and stair session with a grip finisher.","kit":"Hill, stairs, pack 10 kg, bar and towel","mission":"10 hill sprints of 10 s; 6 stair climbs with the pack; 3 maximal towel hangs; 5 min box breathing to finish.","std":"Every sprint and climb within 10 percent of the first."},{"name":"THE PYRAMID","brief":"Bodyweight volume pyramid adapted from naval special warfare preparation.","kit":"Pull-up bar; running route","mission":"Climb from step 1 to step 10 and back down. At each step: pull-ups equal to the step number, push-ups at twice the step, and hollow rocks at three times the step. Run 400 m after steps 5 and 10 on the way up and on the way down. Cleared trainees stop at the top.","std":"Full pyramid (100 pull-ups, 200 push-ups, 300 hollow rocks) in under 45 min."},{"name":"SCRAMBLE","brief":"Grappler's strength and conditioning circuit.","kit":"Heavy bag or sandbag, dumbbells, kettlebell, plate, band","mission":"4 rounds, 2 min rest: heavy bag bear-hug lift and 20 m carry; 5 plyometric push-ups; 5 dumbbell power jerks; 5 fast band-assisted pull-ups; 30 m offset carry per side; 60 s wrist complex; 60 s plate shoulder circuit.","std":"Every round at full speed with technique intact."},{"name":"DEEP WATER","brief":"Fin and sidestroke session for long-range water movement.","kit":"Pool or calm patrolled water, fins, rescue tube, buddy","mission":"400 m warm-up; 1,000 m fin swim; 4 x 100 m combat sidestroke; 4 x 25 m casualty tow; 5 min tread with the final minute hands up.","std":"1,000 m fin swim under 18 min; sidestroke repeats within 5 s of each other."},{"name":"DEBRIEF","brief":"Structured recovery day.","kit":"None","mission":"30 to 45 min Zone 1 walk or easy swim; Joint Integrity Routine; 5 min box breathing; kit and foot maintenance.","std":"Feel better at the end than at the start."}],"refs":["CrossFit. (2015). Gymnastics training guide. CrossFit, Inc.","Department of the Army. (2020). FM 7-22: Holistic health and fitness. Headquarters, Department of the Army.","Foster, C., Florhaug, J. A., Franklin, J., Gottschall, L., Hrovatin, L. A., Parker, S., Doleshal, P., & Dodge, C. (2001). A new approach to monitoring exercise training. Journal of Strength and Conditioning Research, 15(1), 109–115.","Gabbett, T. J. (2016). The training–injury prevention paradox: Should athletes be training smarter and harder? British Journal of Sports Medicine, 50(5), 273–280. https://doi.org/10.1136/bjsports-2015-095788","Haff, G. G., & Triplett, N. T. (Eds.). (2016). Essentials of strength training and conditioning (4th ed.). Human Kinetics.","Harøy, J., Clarsen, B., Wiger, E. G., Øyen, M. G., Serner, A., Thorborg, K., Hölmich, P., Andersen, T. E., & Bahr, R. (2019). The Adductor Strengthening Programme prevents groin problems among male football players: A cluster-randomised controlled trial. British Journal of Sports Medicine, 53(3), 150–157. https://doi.org/10.1136/bjsports-2017-098937","Helms, E. R., Cronin, J., Storey, A., & Zourdos, M. C. (2016). Application of the repetitions in reserve-based rating of perceived ex const store = { get(k, d) { try { const v = localStorage.getItem("kestrel:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CARD = Object.fromEntries(D.cards.map(c => [c.id, c]));
const GROUP = Object.fromEntries(D.groups.map(g => [g.k, g]));
function lk(t) {
  return esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\b([KESTRVLCWM])-(\d\d)\b/g, (m) => CARD[m] ? `<a class="code" data-id="${m}">${m}</a>` : m);
}

// ---------- manual model ----------
const SECTIONS = []; { let cur = null, sub = null;
  for (const it of D.cap) {
    if (it.t === "h1") { cur = { title: it.x, subs: [] }; sub = { title: null, items: [] }; cur.subs.push(sub); SECTIONS.push(cur); }
    else if (it.t === "h2") { sub = { title: it.x, items: [] }; cur.subs.push(sub); }
    else if (cur) sub.items.push(it);
  } }
const findSub = pre => { for (const s of SECTIONS) for (const b of s.subs) if (b.title && b.title.startsWith(pre)) return b; return null; };
const firstTable = pre => (findSub(pre) || { items: [] }).items.find(i => i.t === "table");
function renderItems(items) {
  let h = "", list = null;
  const flush = () => { if (list) { h += `<${list.tag} class="tight">${list.li.join("")}</${list.tag}>`; list = null; } };
  for (const it of items) {
    if (it.t === "li" || it.t === "ol") { const tag = it.t === "ol" ? "ol" : "ul"; if (!list || list.tag !== tag) { flush(); list = { tag, li: [] }; } list.li.push(`<li>${lk(it.x)}</li>`); continue; }
    flush();
    if (it.t === "p") h += `<p>${lk(it.x)}</p>`;
    else if (it.t === "h3") h += `<h4>${esc(it.x)}</h4>`;
    else if (it.t === "table") h += tableHTML(it.h, it.r);
    else if (it.t === "callout") h += `<div class="warn"><b>${esc(it.title)}</b>${it.lines.map(l => `<div>${lk(l)}</div>`).join("")}</div>`;
  }
  flush(); return h;
}
const tableHTML = (h, r, hl) => `<div class="tw"><table><thead><tr>${h.map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${r.map((row, i) => `<tr class="${hl === i ? "hl" : ""}">${row.map(c => `<td>${lk(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

function daysFrom(pre) {
  const b = findSub(pre), out = []; let d = null;
  for (const it of b.items) { if (it.t === "h3") { d = { name: it.x, table: null }; out.push(d); } else if (it.t === "table" && d && !d.table) d.table = it; }
  return out;
}
const P3 = daysFrom("9.1"), P4 = daysFrom("9.2"), P5T = firstTable("9.3");
const dayByName = (arr, n) => arr.find(d => d.name.startsWith(n));
const PROGS = {
  "3": { name: "Three-Day", days: [["Mon", P3[0]], ["Wed", P3[1]], ["Fri", P3[2]]] },
  "4": { name: "Four-Day", days: [["Mon", dayByName(P4, "Monday")], ["Tue", dayByName(P4, "Tuesday")], ["Thu", dayByName(P4, "Thursday")], ["Sat", dayByName(P4, "Saturday")]] },
  "5": { name: "Five-Day", days: P5T.r.map(r => [r[0].slice(0, 3), { name: `${r[0]}: ${r[1]}`, text: r[2], focus: r[1] }]) },
};
const BLOCK = { "6": firstTable("10.2"), "8": firstTable("10.3"), "12": firstTable("10.4") };
function currentWeek() {
  if (S.start) { const w = Math.floor((Date.now() - new Date(S.start + "T00:00:00").getTime()) / 6048e5) + 1; return Math.min(Math.max(w, 1), +S.block); }

}

function weekRow() { const t = BLOCK[S.block], w = currentWeek(); return { t, w, row: t.r[w - 1] }; }
function rotationFor(w) { return "ABCD"[(w - 1) % 4]; }
function sessionRows(day) {
  // returns list of {code,name,sets,int,rest} or text
  if (day.table && day.table.h[0] === "#") return day.table.r.map(r => ({ lab: r[0], mv: r[1], sets: r[2], int: r[3], rest: r[4] }));

  }

  const ramp = firstTable("4.1"); const joint = firstTable("4.2");

  } else if (day.text) {
    const m = day.text.match(/As 4-day (\w+)/);
    if (m) { const ref = dayByName(P4, m[1]); const rr = sessionRows(ref);

let BT = null, BTid = null;
function btGo(b) { if (!BT || BT.run) return; BT.run = true; beep(660); BTid = setInterval(() => { BT.left--; if (BT.left <= 3 && BT.left > 0) beep(520, .06); if (BT.left <= 0) { if (BT.ph === "rest") { BT.ph = "hold"; BT.left = BT.rows[BT.i][0]; beep(880, .3); } else { const r = BT.rows[BT.i][1]; BT.i++; if (BT.i >= BT.rows.length || !r) { btStop(); $("#btph").textContent = "Table complete"; beep(990, .6); return; } BT.ph = "rest"; BT.left = r; beep(440, .3); } } $("#btd").textContent = fmt(BT.left); $("#btph").textContent = BT.ph === "hold" ? `Hold · round ${BT.i + 1}` : `Breathe calmly · before round ${BT.i + 1}`; $("#btph").className = "phase " + (BT.ph === "hold" ? "work" : "rest"); }, 1000); }
function btStop() { clearInterval(BTid); if (BT) BT.run = false; }
// Readiness
function openReadiness() {
  const t = firstTable("12.1");
  openSheet(`<h2>Daily readiness check</h2><p class="small mute">Score each marker on waking.</p>${t.r.map((r, i) => `<div style="margin:8px 0"><b>${esc(r[0])}</b><div class="grid3" style="margin-top:4px">${[1, 2, 3].map(j => `<button class="btn ghost sm rd" data-i="${i}" data-v="${j}" onclick="rdPick(this)">${["", "Green", "Amber", "Red"][j]}<br><span class="small mute">${esc(r[j])}</span></button>`).join("")}</div></div>`).join("")}<div id="rdout" class="card"></div><button class="btn ghost" onclick="closeSheet()">Close</button>`);
  window.RD = {};
}
function rdPick(b) { const i = b.dataset.i, v = +b.dataset.v; RD[i] = v; document.querySelectorAll(`.rd[data-i="${i}"]`).forEach(x => x.style.outline = ""); b.style.outline = `2px solid ${["", "#3FB37F", "#E0A93B", "#D2334E"][v]}`;
  const vals = Object.values(RD); const red = vals.includes(3), amb = vals.filter(x => x === 2).length;
  $("#rdout").innerHTML = red ? `<b class="g-red">Red:</b> run the Debrief operation or rest.` : amb >= 2 ? `<b class="g-amber">Amber:</b> cut sets by 30 percent and cap RPE at 7.` : `<b class="g-green">Green:</b> train as written.`; }

// ---------- nav and render ----------
const VIEWS = { today: ["Today", viewToday, '<path d="M4 6h16M4 12h16M4 18h10"/>'], plan: ["Plan", viewPlan, '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>'], library: ["Library", viewLibrary, '<path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 4.5l3.8 1 -3.9 15 -3.8-1z"/>'], manual: ["Manual", viewManual, '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>'], learn: ["Learn", viewLearn, '<path d="M12 3l10 5-10 5L2 8z"/><path d="M6 10v5c3 2.5 9 2.5 12 0v-5"/>'], tools: ["Tools", viewTools, '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>'] };
let current = (location.hash || "").slice(1); if (!VIEWS[current]) current = "today";
function go(v) { current = v; if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v); render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== current) { current = v; render(); } });
function render() {
  $("#nav").innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button class="${k === current ? "on" : ""}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${v[2]}</svg>${v[0]}</button>`).join("");
  const { w, row } = weekRow(); $("#hdrsub").innerHTML = `${S.prog}-day · week ${w}/${S.block}<br>${esc(row[1])}`;
  $("#app").innerHTML = VIEWS[current][1]();
}
render();
// ---------- installable app ----------
try { if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; const b = document.getElementById("installBtn"); b.style.display = "inline-block"; document.getElementById("hdrsub").style.marginLeft = "0"; });
document.getElementById("installBtn").addEventListener("click", async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; document.getElementById("installBtn").style.display = "none"; });
window.addEventListener("appinstalled", () => { document.getElementById("installBtn").style.display = "none"; });
</script>
